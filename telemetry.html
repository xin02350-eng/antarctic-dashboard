<!-- 极地氛围层：雪花画布 / 页面扫描线 / 设备编号铭牌 -->
<canvas id="snowField" aria-hidden="true"></canvas>

<div class="polar-badge">ANT-A01 · POLAR STATION · REMOTE SENSOR NODE</div>

<!-- =========================================================
     极地氛围辅助层：雪花 + 冰晶（纯 canvas，不影响数据链路）
========================================================= -->
<script>
(function () {
  'use strict';
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('snowField');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var N = 60;
  var flakes = [];
  var running = true;

  function init() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = [];
    for (var i = 0; i < N; i++) {
      flakes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.6 + Math.random() * 1.8,
        vy: 0.1 + Math.random() * 0.25,
        ph: Math.random() * 6.28,
        sw: 0.12 + Math.random() * 0.2,
        a: 0.16 + Math.random() * 0.3,
        ice: i % 10 === 0
      });
    }
  }

  function tick() {
    if (!running) return;
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.vy;
      f.ph += 0.006;
      f.x += Math.sin(f.ph) * f.sw;
      if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
      if (f.x < -5) f.x = w + 5;
      if (f.x > w + 5) f.x = -5;
      if (f.ice && f.r > 1.2) {
        var L = f.r * 3;
        ctx.strokeStyle = 'rgba(205,238,255,' + (f.a * 0.45).toFixed(3) + ')';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(f.x - L, f.y); ctx.lineTo(f.x + L, f.y);
        ctx.moveTo(f.x, f.y - L); ctx.lineTo(f.x, f.y + L);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(210,240,255,' + f.a.toFixed(3) + ')';
        ctx.fill();
      }
    }
    window.requestAnimationFrame(tick);
  }

  window.addEventListener('resize', init);
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) window.requestAnimationFrame(tick);
  });
  init();
  tick();
})();
</script>

<!-- 数据核心（main.js 保持不变，负责写入原始数据） -->
<script src="./js/main.js"></script>

<!-- =========================================================
     遥测终端辅助渲染层（纯显示逻辑，不拦截 main.js）
     最近 20 条，13 个关键字段全量展示，终端/表格混合风格
========================================================= -->
<script>
(function () {
  'use strict';
  var box = document.getElementById('telemetryData');
  if (!box) return;
  var rendering = false;

  /* 表头：13 个通道（与页面标题一致） */
  var HEADERS = [
    'TIME', 'MODE', 'VOLTAGE', 'CURRENT', 'SOLAR',
    'INSIDE TEMP', 'INSIDE HUMIDITY', 'OUTSIDE TEMP', 'OUTSIDE HUMIDITY',
    'LATITUDE', 'LONGITUDE', 'SATELLITES', 'GPS STATUS'
  ];

  /* 数据列与 data.json 字段对应（SOLAR 即 SOLAR IRRADIANCE） */
  var CELL_KEYS = ['v', 'a', 's', 't', 'h', 'j', 'k', 'x', 'y', 'n'];

  function render() {
    if (rendering) return;
    if (typeof DATA === 'undefined' || !DATA || !DATA.length) return;
    rendering = true;

    /* 与 main.js 保持一致：取最后 20 条并倒序 */
    var list = DATA.slice(Math.max(0, DATA.length - 20)).reverse();
    var html = '<div class="tel-scroll"><table class="tel-table"><thead><tr>';

    HEADERS.forEach(function (h) { html += '<th>' + h + '</th>'; });
    html += '</tr></thead><tbody>';

    list.forEach(function (d) {
      var modeRaw = (d.mode !== null && d.mode !== undefined) ? d.mode : 'N';
      var modeSt = modeRaw === 'E' ? 'EMERGENCY' : (modeRaw === 'S' ? 'STANDBY' : 'NORMAL');
      var modeCls = modeRaw === 'E' ? 'm-emergency' : (modeRaw === 'S' ? 'm-standby' : 'm-normal');
      var gpsOk = d.x !== null && d.x !== undefined && d.y !== null && d.y !== undefined;

      /* 行状态：异常红 / 待机黄 / 正常绿 */
      var recCls = (modeRaw === 'E' || !gpsOk) ? 'tel-alert' : (modeRaw === 'S' ? 'tel-warn' : 'tel-ok');
      var time = (typeof formatTelemetryTime === 'function')
        ? formatTelemetryTime(d.time)
        : (d.time || '--');

      html += '<tr class="' + recCls + '">';
      html += '<td class="tel-time">' + time + '</td>';
      html += '<td><span class="tel-mode ' + modeCls + '">' + modeSt + '</span></td>';

      CELL_KEYS.forEach(function (k) {
        var v = d[k];
        var nullCls = (v === null || v === undefined || v === '');
        html += '<td class="tel-val' + (nullCls ? ' null-val' : '') + '">' + (nullCls ? 'NO SIGNAL' : v) + '</td>';
      });

      /* GPS 状态为合成字段：有有效经纬度才显示 ONLINE */
      html += '<td class="tel-val' + (gpsOk ? '' : ' null-val') + '">' + (gpsOk ? 'ONLINE' : 'NO FIX') + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';

    /* 防死循环：内容未变化时不再写 DOM（修复 MutationObserver 自触发导致的空白） */
    if (box.innerHTML === html) { rendering = false; return; }
    box.innerHTML = html;
    rendering = false;
  }

  /* main.js 写入后由 MutationObserver 触发重渲染（rendering 标志防自触发） */
  if (window.MutationObserver) {
    new MutationObserver(render).observe(box, { childList: true, subtree: true });
  }

  /* 兜底轮询：等待 main.js 数据就绪（最长约 30 秒） */
  var tries = 0;
  var poll = setInterval(function () {
    render();
    if (++tries > 60) clearInterval(poll);
  }, 500);
})();
</script>
</body>

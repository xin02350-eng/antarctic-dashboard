    .telemetry-page .tel-sb-thumb:active{

<!-- 数据核心（main.js 保持不变：负责读取 data.json 并写入 #telemetryData） -->
<script src="./js/main.js"></script>

<!-- =========================================================
     Telemetry 最小数据渲染层（纯显示逻辑，不改 main.js）
     - 无 MutationObserver，无自触发，杜绝死循环
     - 每 0.5 秒检查一次 main.js 的全局 DATA，就绪后渲染一次
     - 若 main.js 数据 3 秒内未就绪，自行读取 data.json 兜底
     - 表头 13 通道，最近 20 条，不写死任何数据
========================================================= -->
<script>
(function () {
  'use strict';
  var box = document.getElementById('telemetryData');
  if (!box) return;

  /* ============ 字段元数据：动态读取 data.json 全部字段 ============ */
  var FIELD_META = {
    v:    { label: 'VOLTAGE',          unit: 'V' },
    a:    { label: 'CURRENT',          unit: 'mA' },
    s:    { label: 'SOLAR IRRADIANCE', unit: 'W/m²' },
    t:    { label: 'INSIDE TEMP',      unit: '°C' },
    h:    { label: 'INSIDE HUMIDITY',  unit: '%RH' },
    j:    { label: 'OUTSIDE TEMP',     unit: '°C' },
    k:    { label: 'OUTSIDE HUMIDITY', unit: '%RH' },
    x:    { label: 'LATITUDE',         unit: '°' },
    y:    { label: 'LONGITUDE',        unit: '°' },
    n:    { label: 'SATELLITES',       unit: '' },
    g:    { label: 'GPS STATUS',       unit: '' },
    mode: { label: 'MODE',             unit: '' }
  };
  var KNOWN_ORDER = ['v', 'a', 's', 't', 'h', 'j', 'k', 'x', 'y', 'n', 'g', 'mode'];

  /* 动态收集所有字段（含 i/q/r/e 等未知字段），保持稳定顺序 */
  function collectKeys(list) {
    var keys = [];
    var seen = {};
    list.forEach(function (r) {
      Object.keys(r).forEach(function (k) {
        if (k === 'time' || seen[k]) return;
        seen[k] = true;
        keys.push(k);
      });
    });
    keys.sort(function (a, b) {
      var ia = KNOWN_ORDER.indexOf(a), ib = KNOWN_ORDER.indexOf(b);
      if (ia >= 0 && ib >= 0) return ia - ib;
      if (ia >= 0) return -1;
      if (ib >= 0) return 1;
      return a < b ? -1 : (a > b ? 1 : 0);
    });
    return keys;
  }

  function metaOf(k) {
    return FIELD_META[k] || { label: k.toUpperCase(), unit: '' };
  }

  /* 本地时间格式化：YYYY-MM-DD HH:mm（保留分钟，不依赖 main.js） */
  function fmtTime(t) {
    if (!t) return '--';
    var d = new Date(t);
    if (isNaN(d.getTime())) return String(t);
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* NULL 一律显示 --，不补 0、不插值 */
  function fmtVal(v, unit) {
    if (v === null || v === undefined || v === '') return '--';
    var n = (typeof v === 'number') ? parseFloat(v.toFixed(2)) : v;
    return unit ? n + ' ' + unit : String(n);
  }

  function modeInfo(m) {
    var raw = (m === null || m === undefined || m === '') ? 'N' : String(m);
    return {
      st: raw === 'E' ? 'EMERGENCY' : (raw === 'S' ? 'STANDBY' : 'NORMAL'),
      cls: raw === 'E' ? 'm-emergency' : (raw === 'S' ? 'm-standby' : 'm-normal')
    };
  }

  function gpsInfo(d) {
    var g = d.g;
    if (g === null || g === undefined || g === '') return { text: '--', cls: '' };
    var ok = g === 'O' || g === 'OK' || g === 1 || g === '1' || g === true;
    return ok ? { text: 'ONLINE', cls: 'gps-ok' } : { text: 'NO FIX', cls: 'gps-bad' };
  }

  /* ============ 高性能分批渲染：不全量创建 DOM ============ */
  var BATCH = 50;
  var rowsHtml = [];
  var renderedCount = 0;
  var allDone = false;
  var loadingBusy = false;
  var scrollEl = null;
  var tbodyEl = null;
  var loadEl = null;

  function rowHtml(d, keys) {
    var mi = modeInfo(d.mode);
    var gi = gpsInfo(d);
    var recCls = (mi.st === 'EMERGENCY' || gi.text === 'NO FIX') ? 'tel-alert' :
      (mi.st === 'STANDBY' ? 'tel-warn' : 'tel-ok');
    var html = '<tr class="' + recCls + '">';
    html += '<td class="tel-time">' + fmtTime(d.time) + '</td>';
    html += '<td><span class="tel-mode ' + mi.cls + '">' + mi.st + '</span></td>';
    keys.forEach(function (k) {
      var m = metaOf(k);
      var val = (k === 'mode') ? modeInfo(d[k]).st :
        (k === 'g' ? gi.text : fmtVal(d[k], m.unit));
      var cls = (k === 'g' ? gi.cls : '');
      if (val === '--') cls += ' null-val';
      html += '<td class="tel-val ' + cls.trim() + '">' + val + '</td>';
    });
    html += '</tr>';
    return html;
  }

  function buildShell(keys) {
    var html = '<div class="tel-scroll-wrap">';
    html += '<div class="tel-scroll"><table class="tel-table"><thead><tr>';
    html += '<th>TIME</th><th>MODE</th>';
    keys.forEach(function (k) {
      var m = metaOf(k);
      html += '<th>' + m.label + (m.unit ? '<em>(' + m.unit + ')</em>' : '') + '</th>';
    });
    html += '</tr></thead><tbody></tbody></table></div>';
    html += '<div class="tel-sb tel-sb-v"><div class="tel-sb-thumb" data-dir="v"></div></div>';
    html += '<div class="tel-sb tel-sb-h"><div class="tel-sb-thumb" data-dir="h"></div></div>';
    html += '</div>';
    html += '<div class="tel-loading">LOADING HISTORY…</div>';
    return html;
  }

  /* 追加一批（50 条），使用 DocumentFragment 批量挂载 */
  function appendBatch() {
    if (loadingBusy || allDone) return;
    loadingBusy = true;
    var batch = rowsHtml.slice(renderedCount, renderedCount + BATCH);
    if (!batch.length) {
      allDone = true;
      loadingBusy = false;
      if (loadEl) loadEl.textContent = 'ALL HISTORY LOADED · ' + renderedCount + ' RECORDS';
      return;
    }
    var frag = document.createDocumentFragment();
    var tmp = document.createElement('tbody');
    tmp.innerHTML = batch.join('');
    while (tmp.firstChild) frag.appendChild(tmp.firstChild);
    tbodyEl.appendChild(frag);
    renderedCount += batch.length;
    loadingBusy = false;
    if (renderedCount >= rowsHtml.length) {
      allDone = true;
      if (loadEl) loadEl.textContent = 'ALL HISTORY LOADED · ' + renderedCount + ' RECORDS';
    } else if (loadEl) {
      loadEl.textContent = 'HISTORY ' + renderedCount + ' / ' + rowsHtml.length;
    }
    updateSb();
  }

  /* 自定义滚动条：隐藏原生滚动条，视觉完全由网页控制 */
  function updateSb() {
    var sc = box.querySelector('.tel-scroll');
    var tv = box.querySelector('.tel-sb-v .tel-sb-thumb');
    var th = box.querySelector('.tel-sb-h .tel-sb-thumb');
    if (!sc || !tv || !th) return;
    var sy = sc.scrollHeight, cy = sc.clientHeight, st = sc.scrollTop;
    var sx = sc.scrollWidth, cx = sc.clientWidth, sl = sc.scrollLeft;
    if (sy > cy + 1) {
      var hh = Math.max(26, Math.round(cy * cy / sy));
      tv.style.height = hh + 'px';
      tv.style.top = Math.round((cy - hh) * (st / (sy - cy))) + 'px';
      tv.style.display = 'block';
    } else {
      tv.style.display = 'none';
    }
    if (sx > cx + 1) {
      var hw = Math.max(26, Math.round(cx * cx / sx));
      th.style.width = hw + 'px';
      th.style.left = Math.round((cx - hw) * (sl / (sx - cx))) + 'px';
      th.style.display = 'block';
    } else {
      th.style.display = 'none';
    }
  }

  function initSb() {
    var sc = box.querySelector('.tel-scroll');
    if (!sc) return;
    sc.addEventListener('scroll', updateSb, { passive: true });
    window.addEventListener('resize', function () { setTimeout(updateSb, 60); });
    /* 滑块拖拽（鼠标 / 触摸） */
    box.querySelectorAll('.tel-sb-thumb').forEach(function (thumb) {
      thumb.addEventListener('pointerdown', function (ev) {
        ev.preventDefault();
        var dir = thumb.getAttribute('data-dir');
        var startX = ev.clientX, startY = ev.clientY;
        var st0 = sc.scrollTop, sl0 = sc.scrollLeft;
        function move(mv) {
          if (dir === 'v') {
            var hh = thumb.offsetHeight;
            var maxTop = Math.max(1, sc.clientHeight - hh);
            sc.scrollTop = st0 + (mv.clientY - startY) / maxTop * (sc.scrollHeight - sc.clientHeight);
          } else {
            var ww = thumb.offsetWidth;
            var maxLeft = Math.max(1, sc.clientWidth - ww);
            sc.scrollLeft = sl0 + (mv.clientX - startX) / maxLeft * (sc.scrollWidth - sc.clientWidth);
          }
        }
        function up() {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        }
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    });
    updateSb();
  }

  /* 首屏未填满时自动继续加载 */
  function ensureFill() {
    if (!scrollEl || allDone) return;
    if (tbodyEl.scrollHeight <= scrollEl.clientHeight + 2 && !loadingBusy) {
      appendBatch();
      if (!allDone) requestAnimationFrame(ensureFill);
    }
  }

  /* 滚动接近底部时继续加载下一批 */
  function wireScroll() {
    if (!scrollEl) return;
    scrollEl.addEventListener('scroll', function () {
      if (allDone || loadingBusy) return;
      if (scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 160) {
        appendBatch();
      }
    }, { passive: true });
  }

  /* 渲染入口：已存在表格则跳过（幂等，无循环） */
  function render(list) {
    if (!list || !list.length) return;
    if (box.querySelector('.tel-table')) return;
    var keys = collectKeys(list);
    var titleEl = document.getElementById('dataPanelTitle');
    if (titleEl) titleEl.textContent = 'LATEST ' + list.length + ' RECORDS · 13 CHANNELS';
    box.innerHTML = buildShell(keys);
    scrollEl = box.querySelector('.tel-scroll');
    tbodyEl = box.querySelector('.tel-table tbody');
    loadEl = box.querySelector('.tel-loading');
    rowsHtml = list.slice().reverse().map(function (d) { return rowHtml(d, keys); });
    renderedCount = 0;
    allDone = false;
    appendBatch();
    wireScroll();
    initSb();
    requestAnimationFrame(ensureFill);
  }

  /* 优先使用 main.js 的全局 DATA */
  function readData() {
    try {
      if (typeof DATA !== 'undefined' && DATA && DATA.length) return DATA;
    } catch (e) { /* DATA 未就绪时忽略 */ }
    return null;
  }

  var tries = 0;
  var fallbackSent = false;
  var timer = setInterval(function () {
    var data = readData();
    if (data) {
      render(data);
    } else if (!fallbackSent && tries === 6) {
      /* main.js 数据 3 秒未就绪：自行读取 data.json 兜底（不改 main.js / data.json） */
      fallbackSent = true;
      fetch('./data.json?v=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.length) render(d); })
        .catch(function () { /* 网络失败保持空容器，由 main.js 报错 */ });
    }
    if (++tries > 60) clearInterval(timer);
  }, 500);
})();
</script>
  <!-- 语言切换（全站统一） -->
  <script>
  (function () {
    function apply(lang) {
      document.documentElement.setAttribute('data-lang', lang);
      document.documentElement.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en');
      document.querySelectorAll('.lang-switch button').forEach(function (b) {
        var on = b.getAttribute('data-lang') === lang;
        b.classList.toggle('active', on);
        if (b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', String(on));
      });
      try { localStorage.setItem('anx-lang', lang); } catch (e) {}
    }
    function bind() {
      document.querySelectorAll('.lang-switch button').forEach(function (b) {
        b.addEventListener('click', function (ev) {
          ev.preventDefault();
          apply(b.getAttribute('data-lang'));
        });
      });
    }
    var saved = null;
    try { saved = localStorage.getItem('anx-lang'); } catch (e) {}
    apply(saved === 'zh' ? 'zh' : 'en');
    bind();
  })();
  </script>
</body>

<!-- 极地氛围层：雪花画布 / 页面扫描线 / 设备编号铭牌 -->
<canvas id="snowField" aria-hidden="true"></canvas>

<!-- 极地氛围辅助层：雪花 + 冰晶（纯 canvas，不影响数据链路） -->
<script>
(function () {
  'use strict';
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.getElementById('snowField');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var N = 60;
  var flakes = [];
  var running = true;

  function init() {
    var w = window.innerWidth;
    var h = window.innerHeight;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = [];
    for (var i = 0; i < N; i++) {
      flakes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.6 + Math.random() * 1.8,
        vy: 0.1 + Math.random() * 0.25,
        ph: Math.random() * 6.28,
        sw: 0.12 + Math.random() * 0.2,
        a: 0.16 + Math.random() * 0.3,
        ice: i % 10 === 0
      });
    }
  }

  function tick() {
    if (!running) return;
    var w = window.innerWidth;
    var h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      f.y += f.vy;
      f.ph += 0.006;
      f.x += Math.sin(f.ph) * f.sw;
      if (f.y > h + 5) { f.y = -5; f.x = Math.random() * w; }
      if (f.x < -5) f.x = w + 5;
      if (f.x > w + 5) f.x = -5;
      if (f.ice && f.r > 1.2) {
        var L = f.r * 3;
        ctx.strokeStyle = 'rgba(205,238,255,' + (f.a * 0.45).toFixed(3) + ')';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(f.x - L, f.y); ctx.lineTo(f.x + L, f.y);
        ctx.moveTo(f.x, f.y - L); ctx.lineTo(f.x, f.y + L);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(210,240,255,' + f.a.toFixed(3) + ')';
        ctx.fill();
      }
    }
    window.requestAnimationFrame(tick);
  }

  window.addEventListener('resize', init);
  document.addEventListener('visibilitychange', function () {
    running = !document.hidden;
    if (running) window.requestAnimationFrame(tick);
  });
  init();
  tick();
})();
</script>

<!-- 数据核心（main.js 保持不变：负责读取 data.json 并写入 #telemetryData） -->
<script src="./js/main.js"></script>

<!-- =========================================================
     Telemetry 最小数据渲染层（纯显示逻辑，不改 main.js）
     - 无 MutationObserver，无自触发，杜绝死循环
     - 每 0.5 秒检查一次 main.js 的全局 DATA，就绪后渲染一次
     - 若 main.js 数据 3 秒内未就绪，自行读取 data.json 兜底
     - 表头 13 通道，最近 20 条，不写死任何数据
========================================================= -->
<script>
(function () {
  'use strict';
  var box = document.getElementById('telemetryData');
  if (!box) return;

  /* 表头：13 个通道（与页面标题一致） */
  var HEADERS = [
    'TIME', 'MODE', 'VOLTAGE', 'CURRENT', 'SOLAR',
    'INSIDE TEMP', 'INSIDE HUMIDITY', 'OUTSIDE TEMP', 'OUTSIDE HUMIDITY',
    'LATITUDE', 'LONGITUDE', 'SATELLITES', 'GPS STATUS'
  ];

  /* 数据列与 data.json 字段对应（SOLAR 即 SOLAR IRRADIANCE） */
  var CELL_KEYS = ['v', 'a', 's', 't', 'h', 'j', 'k', 'x', 'y', 'n'];

  /* 本地时间格式化（不依赖 main.js 内部函数） */
  function fmtTime(t) {
    if (!t) return 'NO SIGNAL';
    var d = new Date(t);
    if (isNaN(d.getTime())) return String(t);
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  /* 构建表格 HTML（最近 20 条，倒序，与 main.js 逻辑一致） */
  function buildHtml(list) {
    var html = '<div class="tel-scroll"><table class="tel-table"><thead><tr>';
    HEADERS.forEach(function (h) { html += '<th>' + h + '</th>'; });
    html += '</tr></thead><tbody>';

    var rows = list.slice(Math.max(0, list.length - 20)).reverse();
    rows.forEach(function (d) {
      var modeRaw = (d.mode !== null && d.mode !== undefined) ? d.mode : 'N';
      var modeSt = modeRaw === 'E' ? 'EMERGENCY' : (modeRaw === 'S' ? 'STANDBY' : 'NORMAL');
      var modeCls = modeRaw === 'E' ? 'm-emergency' : (modeRaw === 'S' ? 'm-standby' : 'm-normal');
      var gpsOk = d.x !== null && d.x !== undefined && d.y !== null && d.y !== undefined;
      var recCls = (modeRaw === 'E' || !gpsOk) ? 'tel-alert' : (modeRaw === 'S' ? 'tel-warn' : 'tel-ok');

      html += '<tr class="' + recCls + '">';
      html += '<td class="tel-time">' + fmtTime(d.time) + '</td>';
      html += '<td><span class="tel-mode ' + modeCls + '">' + modeSt + '</span></td>';

      CELL_KEYS.forEach(function (k) {
        var v = d[k];
        var nullCls = (v === null || v === undefined || v === '');
        html += '<td class="tel-val' + (nullCls ? ' null-val' : '') + '">' + (nullCls ? 'NO SIGNAL' : v) + '</td>';
      });

      html += '<td class="tel-val' + (gpsOk ? '' : ' null-val') + '">' + (gpsOk ? 'ONLINE' : 'NO FIX') + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    return html;
  }

  /* 渲染入口：已存在表格则跳过（幂等，无循环） */
  function render(list) {
    if (!list || !list.length) return;
    if (box.querySelector('.tel-table')) return;
    box.innerHTML = buildHtml(list);
  }

  /* 优先使用 main.js 的全局 DATA */
  function readData() {
    try {
      if (typeof DATA !== 'undefined' && DATA && DATA.length) return DATA;
    } catch (e) { /* DATA 未就绪时忽略 */ }
    return null;
  }

  var tries = 0;
  var fallbackSent = false;
  var timer = setInterval(function () {
    var data = readData();
    if (data) {
      render(data);
    } else if (!fallbackSent && tries === 6) {
      /* main.js 数据 3 秒未就绪：自行读取 data.json 兜底（不改 main.js / data.json） */
      fallbackSent = true;
      fetch('./data.json?v=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.length) render(d); })
        .catch(function () { /* 网络失败保持空容器，由 main.js 报错 */ });
    }
    if (++tries > 60) clearInterval(timer);
  }, 500);
})();
</script>

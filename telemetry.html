<div class="app">

        <h1>ANTARCTIC<br>NEXUS</h1>

<!-- 极地氛围层：雪花画布 / 页面扫描线 / 设备编号铭牌 -->

<div class="polar-badge">ANT-A01 · POLAR STATION · REMOTE SENSOR NODE</div>

<!-- 数据核心（main.js 保持不变：负责读取 data.json 并写入 #telemetryData） -->
<script src="./js/main.js"></script>

<!-- =========================================================
     Telemetry 最小数据渲染层（纯显示逻辑，不改 main.js）
     - 无 MutationObserver，无自触发，杜绝死循环
     - 每 0.5 秒检查一次 main.js 的全局 DATA，就绪后渲染一次
     - 若 main.js 数据 3 秒内未就绪，自行读取 data.json 兜底
     - 表头 13 通道，最近 20 条，不写死任何数据
========================================================= -->
<script>
(function () {
  'use strict';
  var box = document.getElementById('telemetryData');
  if (!box) return;

  /* 表头：13 个通道（与页面标题一致） */
  var HEADERS = [
    'TIME', 'MODE', 'VOLTAGE', 'CURRENT (mA)', 'SOLAR',
    'INSIDE TEMP', 'INSIDE HUMIDITY', 'OUTSIDE TEMP', 'OUTSIDE HUMIDITY',
    'LATITUDE', 'LONGITUDE', 'SATELLITES', 'GPS STATUS'
  ];

  /* 数据列与 data.json 字段对应（SOLAR 即 SOLAR IRRADIANCE） */
  var CELL_KEYS = ['v', 'a', 's', 't', 'h', 'j', 'k', 'x', 'y', 'n'];

  /* 本地时间格式化（不依赖 main.js 内部函数） */
  function fmtTime(t) {
    if (!t) return 'NO SIGNAL';
    var d = new Date(t);
    if (isNaN(d.getTime())) return String(t);
    function p(n) { return String(n).padStart(2, '0'); }
    /* 统一整点格式：MM/DD HH（删除分钟） */
    return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours());
  }

  /* 构建表格 HTML（最近 20 条，倒序，与 main.js 逻辑一致） */
  function buildHtml(list) {
    var html = '<div class="tel-scroll"><table class="tel-table"><thead><tr>';
    HEADERS.forEach(function (h) { html += '<th>' + h + '</th>'; });
    html += '</tr></thead><tbody>';

    var rows = list.slice(Math.max(0, list.length - 20)).reverse();
    rows.forEach(function (d) {
      var modeRaw = (d.mode !== null && d.mode !== undefined) ? d.mode : 'N';
      var modeSt = modeRaw === 'E' ? 'EMERGENCY' : (modeRaw === 'S' ? 'STANDBY' : 'NORMAL');
      var modeCls = modeRaw === 'E' ? 'm-emergency' : (modeRaw === 'S' ? 'm-standby' : 'm-normal');
      var gpsOk = d.x !== null && d.x !== undefined && d.y !== null && d.y !== undefined;
      var recCls = (modeRaw === 'E' || !gpsOk) ? 'tel-alert' : (modeRaw === 'S' ? 'tel-warn' : 'tel-ok');

      html += '<tr class="' + recCls + '">';
      html += '<td class="tel-time">' + fmtTime(d.time) + '</td>';
      html += '<td><span class="tel-mode ' + modeCls + '">' + modeSt + '</span></td>';

      CELL_KEYS.forEach(function (k) {
        var v = d[k];
        var nullCls = (v === null || v === undefined || v === '');
        var disp = nullCls ? 'NO SIGNAL' : v;
        /* 电流数值直接以 mA 显示，不换算 */
        if (!nullCls && k === 'a') disp = v + ' mA';
        html += '<td class="tel-val' + (nullCls ? ' null-val' : '') + '">' + disp + '</td>';
      });

      html += '<td class="tel-val' + (gpsOk ? '' : ' null-val') + '">' + (gpsOk ? 'ONLINE' : 'NO FIX') + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    return html;
  }

  /* 渲染入口：已存在表格则跳过（幂等，无循环） */
  function render(list) {
    if (!list || !list.length) return;
    if (box.querySelector('.tel-table')) return;
    box.innerHTML = buildHtml(list);
  }

  /* 优先使用 main.js 的全局 DATA */
  function readData() {
    try {
      if (typeof DATA !== 'undefined' && DATA && DATA.length) return DATA;
    } catch (e) { /* DATA 未就绪时忽略 */ }
    return null;
  }

  var tries = 0;
  var fallbackSent = false;
  var timer = setInterval(function () {
    var data = readData();
    if (data) {
      render(data);
    } else if (!fallbackSent && tries === 6) {
      /* main.js 数据 3 秒未就绪：自行读取 data.json 兜底（不改 main.js / data.json） */
      fallbackSent = true;
      fetch('./data.json?v=' + Date.now())
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { if (d && d.length) render(d); })
        .catch(function () { /* 网络失败保持空容器，由 main.js 报错 */ });
    }
    if (++tries > 60) clearInterval(timer);
  }, 500);
})();
</script>
</body>
</html>

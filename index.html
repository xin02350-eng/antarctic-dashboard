<script>


let DATA=[];


let charts={};





async function loadData(){


try{


let res=

await fetch("data.json?v="+Date.now());


DATA=

await res.json();



refresh();



}


catch(e){


console.log("WAITING DATA.JSON");


}



}





function setValue(id,value){


let el=document.getElementById(id);


if(el)

el.innerHTML=value;


}







function refresh(){


if(!DATA.length)

return;


let last=

DATA[DATA.length-1];




setValue(

"topVoltage",

last.v??"WAITING"

);



setValue(

"topCurrent",

last.a??"WAITING"

);



setValue(

"topSolar",

last.s??"WAITING"

);



setValue(

"topRecords",

last.i??DATA.length

);





let gps=

[...DATA].reverse().find(

x=>x.x&&x.y

);




if(gps){


setValue(

"lat",

gps.x.toFixed(5)+"°"

);



setValue(

"lng",

gps.y.toFixed(5)+"°"

);



setValue(

"sat",

gps.n??"--"

);



setValue(

"fix",

gps.g==="O"

?

"LOCKED"

:

"SEARCHING"

);



}



}





window.onload=()=>{


loadData();


setInterval(

loadData,

1200000

);


}

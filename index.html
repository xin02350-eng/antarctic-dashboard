</style><script>


// ============================
// GLOBAL DATA
// ============================


let ALL_DATA=[];

let charts={};


let map;

let marker;






// ============================
// MAP INIT
// ============================


function initMap(){


map=L.map(
"map",
{
zoomControl:false
}

)
.setView(
[-75,0],
3
);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png",

{

maxZoom:6,

attribution:""

}

).addTo(map);




marker=L.marker(
[-75,0]
)
.addTo(map);



}









// ============================
// UPDATE GPS MAP
// ============================


function updateMap(gps){



if(!gps)
return;



let lat=
Number(gps.x);



let lng=
Number(gps.y);



if(
isNaN(lat)
||
isNaN(lng)
)

return;




marker
.setLatLng(
[
lat,
lng
]
);



map
.setView(
[
lat,
lng
],
4
);



}





// ============================
// CHART CONFIG
// ============================



const chartStyle={


cv:{
name:"Battery Voltage",
color:"#4ddcff"
},


ca:{
name:"Current",
color:"#ffd166"
},


cst:{
name:"Temperature",
color:"#ff7fa8"
},


csh:{
name:"Humidity",
color:"#56d9e8"
},


ctt:{
name:"RS485 Temp",
color:"#ffb866"
},


cth:{
name:"RS485 Hum",
color:"#bda8ff"
},


cs:{
name:"Solar",
color:"#ffe699"
},


cws:{
name:"Wind",
color:"#62ffa2"
}



};









// ============================
// CREATE CHART
// ============================


function createChart(id){



let canvas=

document.getElementById(id);



if(!canvas)
return;



let ctx=

canvas.getContext("2d");



let color=

chartStyle[id].color;




let gradient=

ctx.createLinearGradient(
0,
0,
0,
300
);



gradient.addColorStop(
0,
color+"55"
);



gradient.addColorStop(
1,
color+"00"
);





charts[id]=new Chart(
ctx,
{


type:"line",



data:{


labels:[],


datasets:[{

label:

chartStyle[id].name,


data:[],


borderColor:

color,


backgroundColor:

gradient,


fill:true,


tension:.45,


borderWidth:2.5,


pointRadius:0,


pointHoverRadius:5


}]



},




options:{


responsive:true,


maintainAspectRatio:false,



interaction:{


mode:"index",

intersect:false


},



plugins:{


legend:{


display:false


},



tooltip:{


backgroundColor:
"rgba(3,12,25,.95)",


borderColor:
color,


borderWidth:1


}


},




scales:{


x:{


ticks:{


color:"#7894ad",


maxTicksLimit:8


},


grid:{


color:"rgba(255,255,255,.04)"


}


},




y:{


ticks:{


color:"#7894ad"


},


grid:{


color:"rgba(255,255,255,.04)"


}


}


}



}

);




}









// ============================
// UPDATE CHART
// ============================


function updateChart(
id,
key
){



if(!charts[id])
return;




charts[id]
.data
.labels=


ALL_DATA.map(

d=>

d.time?
d.time.substring(11,19)
:""

);



charts[id]
.data
.datasets[0]
.data=


ALL_DATA.map(

d=>

d[key] ?? null

);



charts[id].update(
"none"
);



}









// ============================
// LOAD JSON
// ============================


async function loadData(){



try{


let res=

await fetch(
"data.json?v="+Date.now()
);



ALL_DATA=

await res.json();



render();



}

catch(err){


console.error(
"DATA ERROR:",
err
);


}



}









// ============================
// RENDER DATA
// ============================


function render(){


if(
!ALL_DATA.length
)

return;




let last=

ALL_DATA[
ALL_DATA.length-1
];





// SYSTEM


document
.getElementById("mode")
.innerHTML=

last.mode || "--";




document
.getElementById("voltage")
.innerHTML=

Number(last.v||0)
.toFixed(2)
+" V";




document
.getElementById("current")
.innerHTML=

Number(last.a||0)
+" mA";




document
.getElementById("error")
.innerHTML=

last.e ?? "--";




document
.getElementById("ssid")
.innerHTML=

last.i || "--";









// GPS FIND


let gps=

[...ALL_DATA]
.reverse()
.find(

d=>

d.x &&
d.y

);




if(gps){



document
.getElementById("lat")
.innerHTML=

Number(gps.x)
.toFixed(5);



document
.getElementById("lng")
.innerHTML=

Number(gps.y)
.toFixed(5);



document
.getElementById("sat")
.innerHTML=

gps.n || "--";



document
.getElementById("fix")
.innerHTML=

gps.g==="O"
?
"LOCKED"
:
"SEARCH";



updateMap(gps);



}





// CHARTS



updateChart(
"cv",
"v"
);


updateChart(
"ca",
"a"
);


updateChart(
"cst",
"j"
);


updateChart(
"csh",
"k"
);


updateChart(
"ctt",
"t"
);


updateChart(
"cth",
"h"
);


updateChart(
"cs",
"s"
);


updateChart(
"cws",
"w"
);







document
.getElementById("update")
.innerHTML=

last.time;



}









// ============================
// START
// ============================


window.onload=function(){



initMap();



Object.keys(chartStyle)
.forEach(

id=>

createChart(id)

);



loadData();



setInterval(

loadData,

300000

);



};



</script><!-- =========================

<script>


// ==========================
// TABLE UPDATE
// ==========================



function updateTable(){


let tbody=

document.getElementById("tbody");



if(!tbody)

return;




tbody.innerHTML="";




ALL_DATA

.slice(-15)

.reverse()

.forEach(
d=>{


let tr=

document.createElement("tr");



tr.innerHTML=

`

<td>${d.time||"--"}</td>

<td>${d.mode||"--"}</td>

<td>${d.v??"--"}</td>

<td>${d.a??"--"}</td>

<td>${d.s??"--"}</td>

<td>${d.j??"--"}</td>

<td>${d.k??"--"}</td>

<td>${d.g??"--"}</td>

<td>${d.e??"--"}</td>

`;



tbody.appendChild(tr);



});


}





// 接入已有render


const oldRenderV4=render;



render=function(){



oldRenderV4();



updateTable();



};





</script>

  <style>
    @font-face{font-family:'LXGW WenKai';src:url('assets/fonts/LXGWWenKai-Home.woff2') format('woff2'),url('assets/fonts/LXGWWenKai-Medium.ttf') format('truetype');font-weight:500;font-display:block}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    html{font-size:16px;font-size:clamp(12px, 0.833333vw, 20px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
    html[data-lang="en"] [data-lang="zh"]{display:none}
    html[data-lang="zh"] [data-lang="en"]{display:none}
    html[data-lang] .lang-switch button{display:inline-block}
    body{background:radial-gradient(ellipse at 66% 42%,#071a2c 0%,#020a14 48%,#01060d 82%);color:#dff6ff;font-family:"Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif;position:relative}
    html[data-lang="zh"] body{font-family:"LXGW WenKai","Ma Shan Zheng","STXingkai","KaiTi","楷体",cursive}
    html:lang(zh-CN) body{font-family:"LXGW WenKai","Ma Shan Zheng","STXingkai","KaiTi","楷体",cursive}
    html[data-lang="zh"] .brand h1,html[data-lang="zh"] .kicker,html[data-lang="zh"] .hero .btn .btn-txt,html[data-lang="zh"] .manifesto p{font-family:"LXGW WenKai","Ma Shan Zheng","STXingkai","KaiTi","楷体",cursive}

    /* 背景深空星光由 WebGL 场景内的轻量星层渲染，避免遮挡与合成差异 */

    /* ---------- 3D 地球画布 ---------- */
    #globe3d{position:fixed;inset:0;z-index:1}
    #globe3d canvas{display:block;filter:grayscale(.06) brightness(.96) contrast(1.02) saturate(.9)}
    .globe-halo{position:fixed;left:66%;top:50%;z-index:0;width:min(56vh,56vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(8,34,56,.38),rgba(4,20,38,.16) 46%,transparent 70%);box-shadow:0 0 90px rgba(50,110,160,.10),0 0 200px rgba(30,75,115,.06);pointer-events:none}
    .globe-fallback{position:fixed;inset:0;z-index:1;display:none;background:radial-gradient(ellipse at 50% 45%,#062030 0%,#01060d 72%)}
    #leaderCv{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

    /* ---------- 南极引导标签（固定于空白区） ---------- */
    .an-label{position:fixed;right:7%;bottom:22%;z-index:12;text-align:right;pointer-events:none;opacity:0;transition:opacity 1.6s ease 1.4s}
    .home-page.loaded .an-label{opacity:1}
    .an-label b{display:block;font-size:1.125rem;letter-spacing:5px;color:#e6f7ff;font-weight:500}
    .an-label span{display:block;font-size:0.8125rem;letter-spacing:3px;color:rgba(170,240,255,.8);margin-top:0.5rem;text-transform:uppercase}
    .globe-node-label{position:absolute;pointer-events:none;white-space:nowrap;padding-left:16px;font-size:10px;letter-spacing:2px;color:rgba(234,252,255,.92);text-shadow:0 1px 5px rgba(1,6,13,.85);font-weight:400}
    .globe-node-label span{display:block;font-size:7px;letter-spacing:1.5px;color:rgba(140,234,255,.6);margin-top:2px}

    .veil{position:fixed;inset:0;z-index:4;pointer-events:none;background:
      linear-gradient(90deg,rgba(1,6,13,.9),rgba(1,6,13,.55) 28%,rgba(1,6,13,.1) 48%,rgba(1,6,13,0) 60%,rgba(1,6,13,.3) 100%),
      linear-gradient(180deg,rgba(1,6,13,.4),rgba(1,6,13,0) 20%,rgba(1,6,13,0) 62%,rgba(1,6,13,.55) 100%)}

    /* ---------- 顶栏 ---------- */
    .top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1.875rem 2.875rem;pointer-events:none;opacity:0;transition:opacity 1.2s ease .2s}
    .home-page.loaded .top{opacity:1}
    .top>*{pointer-events:auto}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{width:40px;height:40px;border:1px solid rgba(98,217,255,.38);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:1px;color:#8ceaff;background:rgba(6,20,34,.3)}
    .brand h1{font-size:0.875rem;letter-spacing:5px;color:#eafcff;font-weight:500}
    .brand h1 span{display:inline}
    .brand p{font-size:8px;letter-spacing:3px;color:#6f93a8;margin-top:3px;text-transform:uppercase}
    .lang-switch{position:relative;display:flex;width:104px;height:30px;border:1px solid rgba(140,234,255,.16);border-radius:999px;background:rgba(7,20,34,.52);backdrop-filter:blur(10px);overflow:hidden;box-shadow:inset 0 0 10px rgba(2,10,18,.35),0 0 16px rgba(98,217,255,.06)}
    .lang-switch .pill{position:absolute;top:3px;left:3px;z-index:1;width:calc(50% - 3px);height:calc(100% - 6px);border-radius:999px;background:linear-gradient(135deg,rgba(45,212,170,.32),rgba(98,217,255,.26));box-shadow:0 0 10px rgba(98,217,255,.10);transition:transform .3s cubic-bezier(.4,0,.2,1)}
    html[data-lang="en"] .lang-switch .pill{transform:translateX(100%)}
    .lang-switch button{position:relative;z-index:2;flex:1;border:0;background:transparent;color:rgba(140,234,255,.55);font-size:0.5625rem;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:color .25s ease,text-shadow .25s ease}
    .lang-switch button:hover{color:#cfe9ff}
    .lang-switch button.active{color:#eafcff;text-shadow:0 0 8px rgba(140,234,255,.35)}

    /* ---------- Hero ---------- */
    .hero{position:fixed;left:calc(7vw + 3.125rem);top:15%;z-index:10;max-width:40rem}
    .hero-content{position:relative;display:block}
    .hero-content>*{margin-left:0;padding-left:0;text-align:left}
    .kicker{display:flex;align-items:center;gap:1rem;font-size:0.6875rem;letter-spacing:.52em;color:rgba(140,234,255,.68);margin-bottom:2.125rem;text-transform:uppercase;opacity:0;transform:translateY(14px)}
    .kicker::before{content:"";width:80px;height:1px;background:linear-gradient(90deg,rgba(98,217,255,.8),transparent)}
    html[data-lang="zh"] .kicker{margin-bottom:1.875rem}
    .home-page.loaded .kicker{opacity:1;transform:none;transition:opacity .9s ease .4s,transform .9s ease .4s}
    .hero h1{font-size:36px;font-size:clamp(28px,3.2vw,55px);line-height:1.3;font-weight:200;letter-spacing:.1em;opacity:0;transform:translateY(20px)}
    .hero h1 > span{display:flex;flex-direction:column;align-items:flex-start;gap:1.125rem}
    html[data-lang="zh"] .hero h1 > span{gap:2rem}
    .hero h1 em{font-style:normal;background:linear-gradient(180deg,#f2fdff 24%,#8ceaff 92%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero h1 em:first-child{font-family:"Noto Sans SC","Segoe UI Light","Microsoft YaHei UI Light","Microsoft YaHei","PingFang SC",sans-serif;font-size:.6em;font-weight:300;letter-spacing:.34em;background:none;color:rgba(170,215,238,.82);-webkit-text-fill-color:rgba(170,215,238,.82);-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent 98%);mask-image:linear-gradient(90deg,#000 60%,transparent 98%)}
    .hero h1 em:last-child{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;font-size:1em;font-weight:400;letter-spacing:.12em;margin-left:1.05em}
    .hero h1 em:last-child::after{content:"";display:block;width:100%;min-width:28rem;max-width:34rem;height:1px;margin-top:1rem;background:linear-gradient(90deg,rgba(140,234,255,.55),rgba(140,234,255,.08) 72%,transparent);opacity:.8}
    html[data-lang="zh"] .hero h1{font-size:3.875rem}
    html[data-lang="zh"] .hero h1 em:first-child{font-family:"LXGW WenKai","Ma Shan Zheng","Zhi Mang Xing","STXingkai","KaiTi","STKaiti","楷体",cursive;letter-spacing:.38em;transform:scaleX(1.04);transform-origin:left center;color:rgba(190,228,244,.9);-webkit-text-fill-color:rgba(190,228,244,.9)}
    html[data-lang="zh"] .hero h1 em:last-child{font-family:"LXGW WenKai","Ma Shan Zheng","Zhi Mang Xing","STXingkai","KaiTi","STKaiti","楷体",cursive;letter-spacing:.30em;margin-left:calc(1.05em + 2.8125rem);font-weight:600;-webkit-text-stroke:0.7px rgba(140,205,235,.30);background:linear-gradient(180deg,#eaf8ff 0%,#b9e2f7 38%,#7fc4ea 72%,#4f8fb8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;transform:scaleX(1.05);transform-origin:left center}
    .home-page.loaded .hero h1{opacity:1;transform:none;transition:opacity 1s ease .55s,transform 1s ease .55s}
    /* V49.2 · 精简说明文字后的留白层级：标题 → 探索按钮 */
    /* V49.39 · 探索入口：主标题与理念文案之间的行动节点（Mission Pulse） */
    /* V49.49 · 外框居中留白 + 边框流光强化 + 文字流光强化（文字位置完全不变） */
    .hero .btn{position:fixed;left:calc(7vw + 9.125rem);top:68.8%;display:inline-block;padding:0.375rem 0.875rem;font-size:0.75rem;letter-spacing:5px;color:#eafcff;text-decoration:none;text-transform:uppercase;cursor:pointer;border:0;background:none;font-family:inherit;opacity:0;transform:translateY(14px);border-radius:4px}
    html[data-lang="en"] .hero .btn{left:calc(7vw + 7.6875rem)}
    .hero .btn-ghost{display:block;height:calc(9vh + 36px)}
    .hero .btn::before{content:"";position:absolute;inset:-2px -18px 2px -18px;border-radius:7px;padding:4px;background:conic-gradient(from var(--flow-angle),rgba(105,150,185,0) 0 56%,rgba(110,175,210,.34) 64%,rgba(150,210,240,.72) 70%,rgba(205,245,255,1) 77%,#f2fdff 81%,rgba(190,240,255,1) 85%,rgba(120,195,230,.52) 91%,rgba(105,150,185,0) 97%,rgba(105,150,185,0) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:flowBorder 6.5s linear infinite;pointer-events:none}
    .hero .btn .explore-panel{position:absolute;inset:-2px -18px 2px -18px;border:1px solid transparent;border-radius:7px;background:transparent;box-shadow:none;opacity:0;pointer-events:none}
    .hero .btn .btn-txt{position:relative;display:inline-block;color:#8ec9e8;-webkit-text-fill-color:#8ec9e8;font-size:1.625rem;font-weight:600;line-height:1;letter-spacing:1px;top:-0.5px}
    html[data-lang="en"] .hero .btn .btn-txt{font-size:1.4375rem;letter-spacing:3px}
    html[data-lang="en"] .kicker{font-size:10px}
    .hero .btn .btn-txt .explore-base{display:inline-block;background:linear-gradient(180deg,#e6f7fe 0%,#a9d4ec 40%,#7fa9c8 62%,#4c7594 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 8px rgba(110,210,245,.20)) drop-shadow(0 1px 0 rgba(225,248,255,.10))}
    .hero .btn .btn-txt .explore-shine{position:absolute;inset:0;color:transparent;background:linear-gradient(100deg,rgba(150,210,240,0) 36%,rgba(240,252,255,1) 50%,rgba(150,210,240,0) 64%);background-size:220% 100%;background-position:130% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 9px rgba(180,235,255,.38));animation:txtSweep 6.5s ease-in-out infinite;pointer-events:none}
    .hero .btn .explore-arrow{position:relative;display:inline-block;width:3rem;height:1rem;margin-left:0.75rem;top:-7px;vertical-align:middle;animation:arrowAdvance 6.5s ease-in-out infinite}
    .hero .btn .explore-arrow svg{display:block;width:100%;height:100%}
    html[data-lang="zh"] .hero .btn .explore-arrow{top:-8px;margin-left:1.125rem;width:3.25rem}
    html[data-lang="zh"] .hero .btn .btn-txt{letter-spacing:.22em}
    .hero .btn .explore-arrow .trail{fill:none;stroke:#8fb6cf;stroke-width:1.8;stroke-linecap:round}
    .hero .btn .explore-arrow .t1{opacity:.18;animation:trail1 2.6s ease-in-out infinite}
    .hero .btn .explore-arrow .t2{opacity:.30;animation:trail2 2.6s ease-in-out infinite}
    .hero .btn .explore-arrow .t3{opacity:.42;animation:trail3 2.6s ease-in-out infinite}
    .hero .btn .explore-arrow .rail{fill:none;stroke:#5f87a5;stroke-width:3;stroke-linecap:round;opacity:.55}
    .hero .btn .explore-arrow .arrow-shape{fill:none;stroke:url(#arrowGrad);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;opacity:.94}
    .hero .btn .explore-arrow .flow-arrow{fill:none;stroke:#cfe9f8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent 0,transparent 43%,rgba(0,0,0,.18) 47%,#000 50%,rgba(0,0,0,.18) 53%,transparent 57%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,transparent 43%,rgba(0,0,0,.18) 47%,#000 50%,rgba(0,0,0,.18) 53%,transparent 57%,transparent 100%);-webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-position:100% 0;mask-position:100% 0;animation:arrowFlow 6.5s ease-in-out infinite;pointer-events:none}
    .hero .btn .explore-arrow .wing-inner{fill:none;stroke:#d7edf7;stroke-width:2;stroke-linecap:round;stroke-linejoin:miter;opacity:.9;animation:tipFlash 2.6s ease-in-out infinite}
    .hero .btn .explore-arrow .tip-glint{fill:none;stroke:#f4fdff;stroke-width:1.8;stroke-linecap:round;opacity:0;animation:tipGlint 2.6s ease-in-out infinite}
    .home-page.loaded .hero .btn:hover{transform:scale(1.06);filter:brightness(1.15)}
    .hero .btn:hover .explore-panel{border-color:rgba(150,210,240,.50);background:linear-gradient(180deg,rgba(16,42,66,.60),rgba(6,20,36,.52));box-shadow:inset 0 1px 0 rgba(215,245,255,.22),inset 0 -1px 0 rgba(0,6,14,.45),inset 0 0 0 1px rgba(180,225,245,.12)}
    .hero .btn:hover .btn-txt .explore-base{filter:drop-shadow(0 0 10px rgba(120,215,250,.35)) drop-shadow(0 0 22px rgba(90,190,235,.20)) drop-shadow(0 1px 0 rgba(235,250,255,.16))}
    .hero .btn:hover .explore-arrow .arrow-shape{opacity:1}
    .hero .btn:hover::before{animation-duration:3.2s}
    .hero .btn:hover .btn-txt .explore-shine{animation-duration:3.2s}
    .hero .btn:hover .explore-arrow{animation-duration:3.2s}
    .hero .btn:hover .explore-arrow .flow-arrow{animation-duration:3.2s}
    .hero .btn:hover .btn-txt .explore-shine{animation-duration:3.2s}
    .hero .btn:hover .btn-txt .explore-base{animation-duration:3.2s}
    .hero .btn:active{filter:brightness(1.4)}
    .hero .btn:focus-visible{outline:1px solid rgba(140,234,255,.75);outline-offset:10px;border-radius:4px}
    .home-page.loaded .hero .btn{opacity:1;transform:none;transition:opacity 1s ease .85s,transform .45s cubic-bezier(.22,1,.36,1),filter .35s ease}
    @property --flow-angle{syntax:'<angle>';inherits:false;initial-value:0deg}
    @keyframes flowBorder{to{--flow-angle:360deg}}
    @keyframes txtSweep{0%,46%{opacity:0;background-position:130% 0}50%{opacity:1}52%{opacity:1;background-position:130% 0}78%{background-position:-30% 0}82%,100%{opacity:0;background-position:-30% 0}}
    @keyframes arrowFlow{0%,72%{opacity:0;-webkit-mask-position:100% 0;mask-position:100% 0}76%{opacity:.75}78%{opacity:.75;-webkit-mask-position:100% 0;mask-position:100% 0}92%{opacity:.75;-webkit-mask-position:0% 0;mask-position:0% 0}96%,100%{opacity:0;-webkit-mask-position:0% 0;mask-position:0% 0}}
    @keyframes arrowAdvance{0%,82%{transform:translateX(0);animation-timing-function:cubic-bezier(.16,1,.3,1)}90%{transform:translateX(7px);animation-timing-function:cubic-bezier(.65,0,.35,1)}100%{transform:translateX(0)}}
    @keyframes tipFlash{0%,85%{stroke:#d7edf7}91%{stroke:#f4fdff}95%,100%{stroke:#d7edf7}}
    @keyframes tipGlint{0%,85%{opacity:0}90%{opacity:.95}94%,100%{opacity:0}}
    @keyframes trail3{0%,58%{opacity:.42}66%{opacity:.95}82%,100%{opacity:.42}}
    @keyframes trail2{0%,62%{opacity:.30}70%{opacity:.80}86%,100%{opacity:.30}}
    @keyframes trail1{0%,66%{opacity:.18}74%{opacity:.65}90%,100%{opacity:.18}}

    /* V49.41 · 恢复“未知之境”原始左下角位置（依据 git HEAD：position:fixed;left:46px;bottom:34px） */
    .manifesto{position:fixed;left:4.125rem;bottom:2.125rem;z-index:12;max-width:30rem;pointer-events:none;opacity:0;transition:opacity 1.2s ease 1.05s}
    .home-page.loaded .manifesto{opacity:1}
    .manifesto::before{content:"";display:block;width:100%;height:1px;background:linear-gradient(90deg,rgba(98,217,255,.35),transparent 80%);margin-bottom:12px}
    .manifesto p{font-size:14px;font-size:clamp(0.75rem,1.05vw,1.0625rem);line-height:1.9;color:rgba(202,229,242,.85);letter-spacing:.6px}

    /* ---------- 离场 ---------- */
    body.is-leaving #globe3d{opacity:.15;transition:opacity .9s ease}
    body.is-leaving .hero{opacity:0;transition:opacity .45s ease}
    body.is-leaving::after{content:"";position:fixed;inset:0;z-index:99;background:radial-gradient(ellipse at 50% 50%,#062033,#01060d 75%);opacity:0;animation:leaveFade .7s ease forwards;pointer-events:none}
    @keyframes leaveFade{to{opacity:1}}

    @media (min-width:701px){
      .hero .btn::after{content:"";position:absolute;left:10px;right:10px;top:-2px;bottom:-2px;background:linear-gradient(90deg,transparent,rgba(200,240,255,.9) 50%,transparent) top / 100% 1px no-repeat,linear-gradient(90deg,transparent,rgba(150,210,240,.28) 50%,transparent) bottom / 100% 1px no-repeat;opacity:0;transform:scaleX(0);transform-origin:left center;transition:opacity .35s ease,transform .55s cubic-bezier(.22,1,.36,1);pointer-events:none;z-index:2}
      .hero .btn:hover::after{opacity:.9;transform:scaleX(1)}
    }
    @media (min-width:1025px){
      html[data-lang="en"] .kicker{margin-bottom:2.5rem;margin-left:-4.625rem}
      html[data-lang="en"] .hero h1{margin-top:-1.5rem;font-size:32px;font-size:clamp(25px,2.5vw,44px);line-height:1.32;letter-spacing:.08em}
      html[data-lang="en"] .hero h1 > span{margin-left:-1.5rem}
      html[data-lang="en"] .hero h1 em{display:inline}
      html[data-lang="en"] .hero h1 em:first-child{font-size:.56em;letter-spacing:.30em;margin-left:-1.25rem}
      html[data-lang="en"] .hero h1 em:last-child{font-family:"Playfair Display","Georgia","Times New Roman",serif;font-size:1em;font-weight:400;letter-spacing:.06em;margin-left:calc(1.05em + 2.5rem)}
    }
    @media (max-width:1024px){
      .hero{left:22px;right:22px;top:auto;bottom:120px;max-width:none}
      .hero h1{font-size:38px;font-size:clamp(30px,6vw,46px)}

      var R = Math.PI / 180;
      var lat1 = a.lat * R, lon1 = a.lng * R, lat2 = b.lat * R, lon2 = b.lng * R;
      var d = 2 * Math.asin(Math.sqrt(Math.pow(Math.sin((lat2 - lat1) / 2), 2) + Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon2 - lon1) / 2), 2)));
      var out = [];

        var x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
        var y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
        var z = A * Math.sin(lat1) + B * Math.sin(lat2);
        out.push({ lat: Math.atan2(z, Math.sqrt(x * x + y * y)) / R, lng: Math.atan2(y, x) / R });

    if (btn) btn.addEventListener('click', function () { if (btn.dataset.busy) return; btn.dataset.busy = '1'; document.body.classList.add('is-leaving'); setTimeout(function () { location.href = './network.html'; }, 850); });
    /* V49.87 · 开始探索：位于“走向未知”与“未知之境”之间 65% 处 */
    function positionExploreBtn() {
      var h1el = document.querySelector('.hero h1');
      var mfel = document.querySelector('.manifesto');
      var btel = document.getElementById('exploreBtn');
      if (!h1el || !mfel || !btel) return;
      var tb = h1el.getBoundingClientRect().bottom;
      var mt = mfel.getBoundingClientRect().top;
      var top = tb + (mt - tb) * 0.65 - btel.offsetHeight / 2;
      top = Math.max(tb + 40, Math.min(mt - btel.offsetHeight - 40, top));
      btel.style.setProperty('top', Math.round(top) + 'px', 'important');
      var spans = document.querySelectorAll('.hero h1 > span');
      var visible = null;
      for (var si = 0; si < spans.length; si++) {
        if (getComputedStyle(spans[si]).display !== 'none') { visible = spans[si]; break; }
      }
      var texts = document.querySelectorAll('.btn-txt');
      var text = null;
      for (var ti = 0; ti < texts.length; ti++) {
        var r = texts[ti].getBoundingClientRect();
        if (r.width > 0 && getComputedStyle(texts[ti]).display !== 'none') { text = texts[ti]; break; }
      }
      if (visible && text) {
        var line2 = visible.querySelectorAll('em')[1];
        var offset = (window.anxCurrentLang === 'zh') ? 0 : 25;
        var target = line2.getBoundingClientRect().left + offset;
        var cur = text.getBoundingClientRect().left;
        var btnRect = btel.getBoundingClientRect();
        var left = btnRect.left + (target - cur);
        left = Math.max(20, Math.min(window.innerWidth - btnRect.width - 20, left));
        btel.style.setProperty('left', Math.round(left) + 'px', 'important');
      }
    }
    positionExploreBtn();
    setTimeout(positionExploreBtn, 350);
    setTimeout(positionExploreBtn, 1800);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(positionExploreBtn, 60); });
    window.addEventListener('resize', positionExploreBtn);
    window.addEventListener('anx:langchange', function () { setTimeout(positionExploreBtn, 60); });
    window.addEventListener('pageshow', function () {
      document.body.classList.remove('is-leaving');
      var btn = document.getElementById('exploreBtn');
      if (btn) btn.dataset.busy = '';
      setTimeout(positionExploreBtn, 60);
    });
    /* 兼容性硬保证：加载完成、窗口获得焦点、以及每 1 秒持续复核并强制锁位，
       即使字体加载很晚、系统缩放变化或外部因素改变布局，最终都会收敛到同一套约束。 */
    window.addEventListener('load', function () { setTimeout(positionExploreBtn, 120); });
    window.addEventListener('focus', function () { setTimeout(positionExploreBtn, 80); });
    setInterval(function () { try { positionExploreBtn(); } catch (e) {} }, 1000);
  })();
  </script>
</body>

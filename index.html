// ======================

async function loadData(){


try{


const res=await fetch("./data.json");


DATA=await res.json();



updateAll();



}

catch(error){


console.error(

"DATA LOAD ERROR",

error

);


}



}







// ======================
// BATTERY SOC
// ======================


function calculateBattery(v){



if(v>=12.7)

return 100;



if(v>=12.6)

return 90+(v-12.6)/0.1*10;



if(v>=12.4)

return 75+(v-12.4)/0.2*15;



if(v>=12.2)

return 55+(v-12.2)/0.2*20;



if(v>=12.0)

return 35+(v-12.0)/0.2*20;



if(v>=11.8)

return 20+(v-11.8)/0.2*15;



if(v>=11.6)

return 5+(v-11.6)/0.2*15;



return 0;


}









// ======================
// DASHBOARD
// ======================


function updateDashboard(){



const last=

DATA[DATA.length-1];



if(!last)

return;





// 电压


document.querySelector("#batteryVoltage")

.innerHTML=

last.v.toFixed(2)

+" V";






// 电量


document.querySelector("#batteryPercent")

.innerHTML=

calculateBattery(last.v).toFixed(0)

+"%";







document.querySelector("#solarValue")

.innerHTML=

last.s

+" W/m²";







document.querySelector("#currentValue")

.innerHTML=

last.a

+" mA";



}









// ======================
// GPS
// ======================


function updateGPS(){



const last=

DATA[DATA.length-1];




if(!last)

return;






document.querySelector("#latitude")

.innerHTML=

last.lat.toFixed(5)+"°";





document.querySelector("#longitude")

.innerHTML=

last.lon.toFixed(5)+"°";






document.querySelector("#satellites")

.innerHTML=

last.sat;






document.querySelector("#gpsStatus")

.innerHTML=

last.gps;



}









// ======================
// TELEMETRY TABLE
// ======================


function updateTelemetry(){



const box=

document.querySelector(

"#telemetryTable"

);



if(!box)

return;



box.innerHTML="";






DATA

.slice(-10)

.reverse()

.forEach(d=>{



let row=document.createElement(

"div"

);



row.className=

"telemetry-row";






row.innerHTML=`

<div>${d.time.substring(11,19)}</div>


<div>${d.v.toFixed(2)} V</div>


<div>${d.a} mA</div>


<div>${d.s} W/m²</div>


<div>${d.outT} ℃</div>


<div>${d.outH} %</div>


<div>${d.inT} ℃</div>


<div>${d.inH} %</div>


`;




box.appendChild(row);



});



}









// ======================
// CHART
// ======================



function createChart(id,key){



const canvas=document.getElementById(id);



if(!canvas)

return;





return new Chart(canvas,{



type:"line",



data:{



labels:

DATA.map(d=>

d.time.substring(11,16)

),



datasets:[{


data:

DATA.map(d=>d[key]),



borderColor:

"#1E4E79",



backgroundColor:

"rgba(30,78,121,.1)",



fill:true,



tension:.3



}]



},




options:{



responsive:true,



maintainAspectRatio:false,



scales:{



y:{



beginAtZero:

key==="s"



},




x:{



ticks:{



maxTicksLimit:8



}


}



}





}



});



}









// ======================
// UPDATE ALL
// ======================


function updateAll(){



updateDashboard();


updateGPS();


updateTelemetry();



}








window.onload=()=>{


loadData();


setInterval(

loadData,

1200000

);

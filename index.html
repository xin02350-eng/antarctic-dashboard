<script>


// ==============================
// CHART ENGINE
// ==============================



const chartConfig={



cv:{
key:"v",
color:"#54eaff"
},



cst:{
key:"j",
color:"#ff9d66"
},



csh:{
key:"k",
color:"#56d9e8"
},



ctt:{
key:"t",
color:"#ffb866"
},



cth:{
key:"h",
color:"#9fb5ff"
},



cs:{
key:"s",
color:"#ffe699"
},



cws:{
key:"w",
color:"#69ffb0"
}



};





let charts={};






function createChart(id){



let canvas=document.getElementById(id);


if(!canvas)

return;



let ctx=canvas.getContext("2d");



let cfg=chartConfig[id];



charts[id]=new Chart(

ctx,

{


type:"line",


data:{


labels:[],


datasets:[{


data:[],


borderColor:cfg.color,


backgroundColor:cfg.color+"33",


fill:true,


tension:.4,


borderWidth:2.5,


pointRadius:0



}]



},



options:{


responsive:true,


maintainAspectRatio:false,



plugins:{


legend:{


display:false


}



},



scales:{



x:{


ticks:{


color:"#7895aa"


},


grid:{


color:"rgba(84,234,255,.05)"


}



},




y:{


beginAtZero:id==="cs",



ticks:{


color:"#7895aa"


}



}



}




}



}



);




}






Object.keys(chartConfig)

.forEach(createChart);

<script>


// ==============================
// DATA SYSTEM
// ==============================



let DATA=[];





function setValue(id,value){


let el=document.getElementById(id);


if(el){

el.innerHTML=value;

}


}








async function loadData(){



try{


let response=

await fetch(

"data.json?v="+Date.now()

);



if(!response.ok)

throw new Error("DATA LOAD ERROR");





DATA=

await response.json();





refreshDashboard();



}


catch(e){


console.log(e);


}



}








function refreshDashboard(){



if(!DATA.length)

return;





let last=

DATA[DATA.length-1];





// 顶部数据


setValue(

"topVoltage",

last.v??"WAITING"

);



setValue(

"topCurrent",

last.a??"WAITING"

);



setValue(

"topSolar",

last.s??"WAITING"

);



setValue(

"topRecords",

last.i??DATA.length

);







// GPS


let gps=

[...DATA]

.reverse()

.find(

x=>x.x!==undefined

&&

x.y!==undefined

);





if(gps){



setValue(

"lat",

Number(gps.x).toFixed(5)+"°"

);



setValue(

"lng",

Number(gps.y).toFixed(5)+"°"

);



setValue(

"sat",

gps.n??"--"

);



setValue(

"fix",

gps.g==="O"

?

"LOCKED"

:

"SEARCHING"

);



}








// 电压统计


let voltages=DATA

.map(

d=>Number(d.v)

)

.filter(

v=>!isNaN(v)

);





if(voltages.length){



setValue(

"mainVoltage",

voltages.at(-1).toFixed(2)

);



setValue(

"vMax",

Math.max(...voltages).toFixed(2)

);



setValue(

"vMin",

Math.min(...voltages).toFixed(2)

);



setValue(

"vAvg",

(

voltages.reduce(

(a,b)=>a+b,

0

)

/

voltages.length

).toFixed(2)

);



}






// 实时流


updateStream();



}








function updateStream(){



let box=

document.getElementById(

"telemetryLog"

);



if(!box)

return;



box.innerHTML="";





DATA

.slice(-8)

.reverse()

.forEach(d=>{



let row=

document.createElement(

"div"

);



row.className=

"telemetry-row";





row.innerHTML=`

<div>${d.time?.substring(11,19)??"--"}</div>

<div>V:

<span>${d.v??"--"}</span>

V</div>

<div>I:

<span>${d.a??"--"}</span>

mA</div>

<div>T:

<span>${d.j??"--"}</span>

℃</div>

<div>SOLAR:

<span>${d.s??"--"}</span>

</div>

`;





box.appendChild(row);



});



}









// ==============================
// CHART UPDATE
// ==============================



function updateCharts(){



Object.keys(charts)

.forEach(id=>{



let cfg=

chartConfig[id];



let chart=

charts[id];





chart.data.labels=

DATA.map(

d=>d.time?.substring(11,19)

);




chart.data.datasets[0].data=

DATA.map(

d=>d[cfg.key]

);



chart.update();



});



}






document.addEventListener(

"DOMContentLoaded",

()=>{



loadData();



setInterval(

loadData,

1200000

);



}

);





</script>







</div>

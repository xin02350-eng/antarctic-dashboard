<script>



let DATA=[];



const chartConfig={


cv:{key:"v",color:"#54eaff"},


cst:{key:"j",color:"#ff9d66"},


csh:{key:"k",color:"#56d9e8"},


ctt:{key:"t",color:"#ffb866"},


cth:{key:"h",color:"#9fb5ff"},


cs:{key:"s",color:"#ffe699"},


cws:{key:"w",color:"#69ffb0"}


};



let charts={};





function createChart(id){


let c=document.getElementById(id);


if(!c)return;



let cfg=chartConfig[id];



charts[id]=new Chart(

c,

{

type:"line",


data:{


labels:[],


datasets:[{

data:[],


borderColor:cfg.color,


backgroundColor:cfg.color+"33",


fill:true,


tension:.4,


pointRadius:0


}]

},


options:{


responsive:true,


maintainAspectRatio:false,


plugins:{legend:{display:false}},


scales:{


y:{

beginAtZero:id==="cs"

}

}



}


}

);


}




Object.keys(chartConfig)

.forEach(createChart);







async function loadData(){


try{


let r=await fetch(

"data.json?v="+Date.now()

);



DATA=await r.json();


update();


}

catch(e){

console.log(e);

}


}






function set(id,v){


let e=document.getElementById(id);


if(e)e.innerHTML=v;


}







function update(){


if(!DATA.length)return;


let d=DATA[DATA.length-1];



set("topVoltage",d.v??"--");

set("topCurrent",d.a??"--");

set("topSolar",d.s??"--");

set("topRecords",d.i??DATA.length);



let gps=

[...DATA].reverse()

.find(x=>x.x&&x.y);



if(gps){


set("lat",gps.x.toFixed(5));

set("lng",gps.y.toFixed(5));

set("sat",gps.n??"--");


set(

"fix",

gps.g==="O"

?

"LOCKED"

:

"--"

);


}




Object.keys(charts)

.forEach(id=>{


let cfg=chartConfig[id];

let ch=charts[id];


ch.data.labels=

DATA.map(x=>x.time);


ch.data.datasets[0].data=

DATA.map(x=>x[cfg.key]);


ch.update("none");


});




}



document.addEventListener(

"DOMContentLoaded",

()=>{


loadData();


setInterval(loadData,1200000);


}

);

<script>


// =====================
// CHART INITIALIZATION
// =====================



const chartConfig={



cv:{key:"v",color:"#54eaff"},


cst:{key:"j",color:"#ff9d66"},


csh:{key:"k",color:"#56d9e8"},


ctt:{key:"t",color:"#ffb866"},


cth:{key:"h",color:"#9fb5ff"},


cs:{key:"s",color:"#ffe699"},


cws:{key:"w",color:"#69ffb0"}



};




let charts={};





function createChart(id){



let canvas=document.getElementById(id);


if(!canvas)return;



let cfg=chartConfig[id];


let ctx=canvas.getContext("2d");



charts[id]=new Chart(

ctx,

{


type:"line",



data:{


labels:[],


datasets:[{


data:[],


borderColor:cfg.color,


backgroundColor:cfg.color+"33",


fill:true,


tension:.4,


borderWidth:2.5,


pointRadius:0



}]



},




options:{


responsive:true,


maintainAspectRatio:false,



plugins:{


legend:{display:false}


},



scales:{



x:{


ticks:{color:"#7895aa"},

grid:{color:"rgba(84,234,255,.05)"}

},




y:{


beginAtZero:id==="cs",


ticks:{color:"#7895aa"}


}



}



}



}

);




}




Object.keys(chartConfig)

.forEach(createChart);


// =====================
// DATA SYSTEM
// =====================



let DATA=[];





function setValue(id,value){


let el=document.getElementById(id);


if(el){

el.innerHTML=value;

}


}









async function loadData(){


try{


let res=

await fetch(

"data.json?v="+Date.now()

);



if(!res.ok)

throw new Error("DATA.JSON ERROR");





DATA=

await res.json();





refreshDashboard();





}


catch(e){


console.log(e);


}



}










function refreshDashboard(){



if(!DATA.length)

return;





let last=

DATA[DATA.length-1];







// =====================
// TOP STATUS
// =====================



setValue(

"topVoltage",

last.v??"WAITING"

);



setValue(

"topCurrent",

last.a??"WAITING"

);



setValue(

"topSolar",

last.s??"WAITING"

);



setValue(

"topRecords",

last.i??DATA.length

);











// =====================
// GPS
// =====================



let gps=

[...DATA]

.reverse()

.find(

d=>

d.x!==undefined

&&

d.y!==undefined

);



if(gps){



setValue(

"lat",

Number(gps.x).toFixed(5)+"°"

);



setValue(

"lng",

Number(gps.y).toFixed(5)+"°"

);



setValue(

"sat",

gps.n??"--"

);



setValue(

"fix",

gps.g==="O"

?

"LOCKED"

:

"SEARCHING"

);



}











// =====================
// VOLTAGE
// =====================



let voltage=

DATA

.map(

d=>Number(d.v)

)

.filter(

v=>!isNaN(v)

);





if(voltage.length){



let current=

voltage[voltage.length-1];



setValue(

"mainVoltage",

current.toFixed(2)

);



setValue(

"vMax",

Math.max(...voltage).toFixed(2)

);



setValue(

"vMin",

Math.min(...voltage).toFixed(2)

);



setValue(

"vAvg",

(

voltage.reduce(

(a,b)=>a+b,

0

)

/

voltage.length

).toFixed(2)

);



}






updateCharts();



updateStream();



}












// =====================
// UPDATE CHART
// =====================



function updateCharts(){



Object.keys(charts)

.forEach(id=>{



let cfg=

chartConfig[id];



let chart=

charts[id];





if(!chart)

return;






chart.data.labels=

DATA.map(

d=>

d.time?

d.time.substring(11,19)

:

""

);







chart.data.datasets[0].data=



DATA.map(


d=>

d[cfg.key]??null


);






chart.update("none");



});



}











// =====================
// LIVE STREAM
// =====================



function updateStream(){



let box=

document.getElementById(

"telemetryLog"

);



if(!box)

return;





box.innerHTML="";






DATA

.slice(-10)

.reverse()

.forEach(d=>{



let row=

document.createElement(

"div"

);



row.className=

"telemetry-row";





row.innerHTML=

`

<div>

${

d.time?

d.time.substring(11,19)

:

"--"

}

</div>


<div>

V:

<span>

${d.v??"--"}

</span>

V

</div>



<div>

I:

<span>

${d.a??"--"}

</span>

mA

</div>




<div>

TEMP:

<span>

${d.j??"--"}

</span>

℃

</div>




<div>

SOLAR:

<span>

${d.s??"--"}

</span>

W/m²

</div>

`;






box.appendChild(row);



});



}

// START
// =====================



document.addEventListener(

"DOMContentLoaded",

()=>{


loadData();



setInterval(

loadData,

1200000

);



}

);




</script>

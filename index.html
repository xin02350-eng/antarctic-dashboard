<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
Antarctic Autonomous Monitoring System
</title>


<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>


<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>



<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">


<style>


*{

box-sizing:border-box;

margin:0;

padding:0;

}



body{


background:

radial-gradient(
circle at top,
#12304a,
#02060c 60%
);


color:#eaf7ff;


font-family:

Arial,
Microsoft YaHei,
sans-serif;


min-height:100vh;


}



.container{


width:min(1200px,95%);


margin:auto;


padding:20px;


}






.header{


height:90px;


display:flex;


justify-content:space-between;


align-items:center;


padding:25px;


background:

rgba(8,22,38,.9);


border:

1px solid rgba(70,220,255,.2);


border-radius:18px;


}





.logo{


font-family:Orbitron;


font-size:26px;


letter-spacing:3px;


color:#4ddcff;


}



.online{


color:#62ffa2;


font-family:Orbitron;


font-size:13px;


}





.grid-status{


display:grid;


grid-template-columns:

repeat(5,1fr);


gap:15px;


margin-top:20px;


}




.card{


background:

rgba(10,25,45,.9);


border:

1px solid rgba(70,220,255,.18);


border-radius:18px;


padding:20px;


text-align:center;


}




.label{


font-size:11px;


letter-spacing:2px;


color:#7894ad;


}



.value{


font-family:Orbitron;


font-size:25px;


margin-top:12px;


color:#4ddcff;


}



.green{

color:#62ffa2;

}


.yellow{

color:#ffd166;

}






.section{


margin-top:25px;


font-family:Orbitron;


letter-spacing:3px;


color:#4ddcff;


font-size:14px;


border-left:

3px solid #4ddcff;


padding-left:10px;


}





.main-map{


margin-top:15px;


height:350px;


border-radius:20px;


overflow:hidden;


border:

1px solid rgba(70,220,255,.25);


}




#map{


height:100%;


width:100%;


}





.panel{


margin-top:20px;


background:

rgba(8,22,38,.9);


border-radius:20px;


border:

1px solid rgba(70,220,255,.15);


padding:20px;


}





.chart-big{


height:400px;


}



canvas{


width:100%!important;


height:100%!important;


}



.small-grid{


display:grid;


grid-template-columns:

1fr 1fr;


gap:20px;


}



.small-chart{


height:300px;


}





.table-box{


overflow:auto;


}




table{


width:100%;


border-collapse:collapse;


}



th{


background:

rgba(70,220,255,.1);


height:40px;


color:#4ddcff;


font-size:12px;


}



td{


padding:12px;


text-align:center;


border-bottom:

1px solid rgba(255,255,255,.05);


font-size:13px;


}



@media(max-width:800px){


.grid-status{


grid-template-columns:

1fr 1fr;


}


.small-grid{


grid-template-columns:

1fr;


}


}


</style>

</head>


<body>


<div class="container">


<div class="header">


<div class="logo">

ANTARCTIC NODE

</div>


<div class="online">

● SYSTEM ONLINE

</div>


</div>




<div class="grid-status">


<div class="card">

<div class="label">
MODE
</div>

<div id="mode" class="value green">
--
</div>

</div>



<div class="card">

<div class="label">
VOLTAGE
</div>

<div id="voltage" class="value">
--
</div>

</div>



<div class="card">

<div class="label">
CURRENT
</div>

<div id="current" class="value yellow">
--
</div>

</div>



<div class="card">

<div class="label">
ERROR
</div>

<div id="error" class="value green">
--
</div>

</div>



<div class="card">

<div class="label">
SESSION
</div>

<div id="ssid" class="value">
--
</div>

</div>



</div>





<div class="section">

POLAR POSITION

</div>



<div class="panel main-map">

<div id="map"></div>

</div>



<div class="section">

ENERGY MONITOR

</div>



<div class="panel chart-big">

<canvas id="cv"></canvas>

</div>



<div class="small-grid">


<div class="panel small-chart">

<canvas id="cs"></canvas>

</div>


<div class="panel small-chart">

<canvas id="ca"></canvas>

</div>


</div><!-- =====================
ENVIRONMENT
===================== -->


<div class="section">

ENVIRONMENT MONITOR

</div>



<div class="small-grid">



<div class="panel small-chart">

<canvas id="cst"></canvas>

</div>



<div class="panel small-chart">

<canvas id="csh"></canvas>

</div>



<div class="panel small-chart">

<canvas id="ctt"></canvas>

</div>



<div class="panel small-chart">

<canvas id="cth"></canvas>

</div>



<div class="panel small-chart">

<canvas id="cws"></canvas>

</div>



</div>







<div class="section">

TELEMETRY DATA

</div>



<div class="panel table-box">


<table>


<thead>


<tr>

<th>TIME</th>

<th>MODE</th>

<th>V</th>

<th>mA</th>

<th>SOLAR</th>

<th>TEMP</th>

<th>HUM</th>

<th>GPS</th>

<th>ERR</th>


</tr>


</thead>



<tbody id="tbody">


</tbody>


</table>



</div>



</div>









<script>



// ======================
// MAP
// ======================


let map;

let marker;



function initMap(){


map=L.map("map")
.setView(
[-75,0],
3
);



L.tileLayer(

"https://tile.openstreetmap.org/{z}/{x}/{y}.png"

)

.addTo(map);



marker=L.marker(
[-75,0]
)
.addTo(map);



}







function updateGPS(d){



if(!d.x || !d.y)

return;



let lat=Number(d.x);

let lng=Number(d.y);



if(isNaN(lat)||isNaN(lng))

return;



marker.setLatLng(
[
lat,
lng
]
);



map.setView(
[
lat,
lng
],
4
);



}





// ======================
// CHART
// ======================



let charts={};



let chartConfig={


cv:["Voltage","v","#4ddcff"],


ca:["Current","a","#ffd166"],


cst:["SHT Temperature","j","#ff7fa8"],


csh:["SHT Humidity","k","#56d9e8"],


ctt:["RS485 Temperature","t","#ffb866"],


cth:["RS485 Humidity","h","#bda8ff"],


cs:["Solar","s","#ffe699"],


cws:["Wind","w","#62ffa2"]


};






function createChart(id){



let c=document.getElementById(id);



if(!c)

return;



let cfg=chartConfig[id];



charts[id]=new Chart(
c,
{


type:"line",


data:{


labels:[],


datasets:[{


label:cfg[0],


data:[],


borderColor:cfg[2],


backgroundColor:
cfg[2]+"22",


fill:true,


tension:.45,


pointRadius:0,


borderWidth:2


}]


},




options:{



responsive:true,


maintainAspectRatio:false,



plugins:{


legend:{


display:false


}


},




scales:{


x:{


ticks:{


color:"#7894ad",


maxTicksLimit:8


},


grid:{


color:"rgba(255,255,255,.05)"


}


},



y:{


ticks:{


color:"#7894ad"


},


grid:{


color:"rgba(255,255,255,.05)"


}


}



}



}



}

);



}









function updateCharts(data){



Object.keys(chartConfig)
.forEach(id=>{


if(!charts[id])

return;



let key=chartConfig[id][1];



charts[id]
.data
.labels=

data.map(

x=>

x.time?
x.time.substring(11,19)
:""

);



charts[id]
.data
.datasets[0]
.data=

data.map(

x=>

x[key]??null

);



charts[id].update();



});



}









// ======================
// DATA
// ======================


let DATA=[];




async function loadData(){



try{



let r=

await fetch(
"data.json?v="+Date.now()
);



DATA=

await r.json();



render();



}

catch(e){



console.log(e);



}



}









function render(){



if(DATA.length===0)

return;



let last=

DATA[DATA.length-1];





document.getElementById("mode")
.innerHTML=

last.mode??"--";




document.getElementById("voltage")
.innerHTML=

(last.v??"--")+" V";





document.getElementById("current")
.innerHTML=

(last.a??"--")+" mA";





document.getElementById("error")
.innerHTML=

last.e??"--";





document.getElementById("ssid")
.innerHTML=

last.i??"--";







let gps=[...DATA]
.reverse()
.find(

x=>

x.x&&x.y

);



if(gps)

updateGPS(gps);







document.getElementById("tbody")
.innerHTML="";





DATA
.slice(-20)
.reverse()
.forEach(d=>{



let tr=document.createElement("tr");



tr.innerHTML=`

<td>${d.time??"--"}</td>

<td>${d.mode??"--"}</td>

<td>${d.v??"--"}</td>

<td>${d.a??"--"}</td>

<td>${d.s??"--"}</td>

<td>${d.j??"--"}</td>

<td>${d.k??"--"}</td>

<td>${d.g??"--"}</td>

<td>${d.e??"--"}</td>

`;



document
.getElementById("tbody")
.appendChild(tr);



});





updateCharts(DATA);



}








window.onload=function(){



initMap();



Object.keys(chartConfig)
.forEach(

id=>

createChart(id)

);



loadData();



setInterval(

loadData,

300000

);



}



</script>



</body>


</html>

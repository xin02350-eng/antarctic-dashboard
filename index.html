<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Antarctic Autonomous Monitoring System
</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>


<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Orbitron:wght@500;700;900&display=swap');


:root{

--bg:#020812;

--panel:
rgba(8,25,45,.72);

--panel-light:
rgba(20,60,90,.35);

--cyan:#4de1ff;

--ice:#b8f1ff;

--green:#58ff9b;

--yellow:#ffd166;

--red:#ff667f;

--text:#eaf8ff;

--muted:#7d9bb8;


--border:
rgba(77,225,255,.2);


--shadow:
0 0 35px rgba(77,225,255,.15);


}


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

padding:25px;

font-family:
Inter,
Microsoft YaHei,
sans-serif;

color:var(--text);


background:

radial-gradient(
circle at 15% 0%,
rgba(77,225,255,.18),
transparent 35%
),

radial-gradient(
circle at 85% 100%,
rgba(88,255,155,.08),
transparent 35%
),

linear-gradient(
180deg,
#020812,
#071b31
);

}



/* ===== HEADER ===== */


.header{

display:flex;

justify-content:space-between;

align-items:center;

padding:25px 35px;

margin-bottom:25px;


background:var(--panel);

border:

1px solid var(--border);


border-radius:26px;


box-shadow:var(--shadow);

}



.header-left h1{


font-family:
Orbitron;


font-size:
clamp(24px,4vw,42px);


letter-spacing:3px;


background:

linear-gradient(
90deg,
#ffffff,
var(--cyan),
var(--green)
);


-webkit-background-clip:text;

color:transparent;


}


.header-left p{


margin-top:12px;


letter-spacing:3px;


font-size:13px;


color:var(--muted);


}



.mission-box{


text-align:right;

font-family:Orbitron;

font-size:12px;

line-height:2;

color:var(--ice);


}


.status-online{

color:var(--green);

}


.status-online::before{

content:"●";

margin-right:8px;

}



@media(max-width:800px){

.header{

display:block;

text-align:center;

}

.mission-box{

margin-top:20px;

text-align:center;

}

}




/* ===== TIME CONTROL ===== */


.slider-box{


background:var(--panel);


border:1px solid var(--border);


border-radius:22px;


padding:18px;


display:flex;


gap:15px;


align-items:center;


justify-content:center;


flex-wrap:wrap;


margin-bottom:22px;


box-shadow:var(--shadow);


}


.section-label{


font-family:Orbitron;


color:var(--ice);


font-size:12px;


letter-spacing:2px;


}



.slider-box button{


padding:

10px 22px;


border-radius:50px;


background:

rgba(255,255,255,.05);


border:

1px solid rgba(255,255,255,.15);


color:var(--muted);


cursor:pointer;


transition:.3s;


}



.slider-box button:hover{


border-color:var(--cyan);


color:white;


}



.slider-box button.active{


background:

linear-gradient(
135deg,
var(--cyan),
var(--green)
);


color:#001018;


font-weight:800;


}



/* ===== STATUS CARDS ===== */


.row{


display:flex;

gap:18px;

flex-wrap:wrap;


margin-bottom:20px;


}



.card{


flex:1;


min-width:150px;


padding:22px;


background:

var(--panel);


border:

1px solid var(--border);


border-radius:22px;


text-align:center;


position:relative;


overflow:hidden;


box-shadow:var(--shadow);


transition:.3s;


}



.card:hover{

transform:translateY(-5px);

border-color:var(--cyan);

}



.card::before{


content:"";


position:absolute;


top:0;

left:0;

right:0;


height:2px;


background:

linear-gradient(
90deg,
transparent,
var(--cyan),
transparent
);


}



.label{


font-size:11px;


letter-spacing:2px;


color:var(--muted);


margin-bottom:12px;


}



.value{


font-family:
Orbitron;


font-size:30px;


font-weight:900;


}



.big{

font-size:18px;

}


.green{
color:var(--green);
}


.yellow{
color:var(--yellow);
}


.red{
color:var(--red);
}


.cyan{
color:var(--cyan);
}


.gold{
color:#ffe58a;
}

<!-- =========================
 CHART SECTION
========================= -->


<div class="chart-section">


<div class="chart-title">

REAL TIME TELEMETRY

<span>
实时环境遥测数据
</span>

</div>



<div class="row charts-row">


<div class="chart-box">
<h3>
BATTERY VOLTAGE
<br>
<span>电池电压 V</span>
</h3>

<canvas id="cv"></canvas>

</div>



<div class="chart-box">
<h3>
SYSTEM CURRENT
<br>
<span>系统电流 mA</span>
</h3>

<canvas id="ca"></canvas>

</div>



</div>





<div class="row charts-row">


<div class="chart-box">

<h3>
SHT35 TEMPERATURE
<br>
<span>空气温度 ℃</span>
</h3>


<canvas id="cst"></canvas>


</div>




<div class="chart-box">

<h3>
SHT35 HUMIDITY
<br>
<span>空气湿度 %RH</span>
</h3>


<canvas id="csh"></canvas>


</div>


</div>







<div class="row charts-row">


<div class="chart-box">

<h3>
RS485 TEMPERATURE
<br>
<span>外部传感器温度 ℃</span>
</h3>


<canvas id="ctt"></canvas>


</div>





<div class="chart-box">

<h3>
RS485 HUMIDITY
<br>
<span>外部传感器湿度 %RH</span>
</h3>


<canvas id="cth"></canvas>


</div>


</div>







<div class="row charts-row">


<div class="chart-box">


<h3>
SOLAR IRRADIANCE
<br>
<span>太阳辐射 W/m²</span>
</h3>


<canvas id="cs"></canvas>


</div>





<div class="chart-box">


<h3>
WIND MONITOR
<br>
<span>风速 / 风向</span>
</h3>


<canvas id="cws"></canvas>


</div>


</div>


</div>






<!-- =========================
 DATA TABLE
========================= -->


<div class="table-box">


<div class="table-header">


<h3>
LIVE TELEMETRY STREAM
</h3>


<div class="receiving">

<span class="live-dot"></span>

DATA RECEIVING

</div>


</div>



<table>


<thead>

<tr>

<th>TIME</th>

<th>MODE</th>

<th>VOLTAGE</th>

<th>CURRENT</th>

<th>SOLAR</th>

<th>SHT TEMP</th>

<th>SHT HUM</th>

<th>RS485 TEMP</th>

<th>RS485 HUM</th>

<th>LAT</th>

<th>LON</th>

<th>SAT</th>

<th>GPS</th>

<th>ERROR</th>


</tr>


</thead>



<tbody id="tbody">


</tbody>



</table>



</div>







<div class="footer">


<span class="live-dot"></span>


<span id="update">

LAST UPDATE

</span>


<br>


ANTARCTIC AUTONOMOUS MONITORING SYSTEM

</div>







<style>


.chart-section{

margin-top:25px;

}



.chart-title{


font-family:
Orbitron;


font-size:22px;


letter-spacing:3px;


color:var(--ice);


margin:

25px 0;


}


.chart-title span{


display:block;


font-family:
Inter;


font-size:13px;


color:var(--muted);


letter-spacing:2px;


margin-top:8px;


}




.chart-box{


flex:1;


min-width:420px;


padding:24px;


background:

var(--panel);


border:

1px solid var(--border);


border-radius:24px;


box-shadow:

var(--shadow);


}



.chart-box h3{


font-family:

Orbitron;


font-size:15px;


letter-spacing:2px;


line-height:1.8;


color:var(--cyan);


margin-bottom:15px;


}


.chart-box h3 span{


font-family:

Inter;


font-size:12px;


color:var(--muted);


letter-spacing:1px;


}



.chart-box canvas{


height:260px!important;


}




.table-header{


display:flex;


justify-content:space-between;


align-items:center;


margin-bottom:20px;


}


.table-header h3{


font-family:

Orbitron;


letter-spacing:3px;


color:var(--ice);


}



.receiving{


font-size:12px;


color:var(--green);


letter-spacing:2px;


}




.live-dot{


display:inline-block;


width:8px;

height:8px;


border-radius:50%;


background:

var(--green);


box-shadow:

0 0 15px var(--green);


margin-right:8px;


animation:

pulse 2s infinite;


}



@keyframes pulse{


50%{

opacity:.35;

transform:scale(1.5);

}


}





@media(max-width:900px){


.chart-box{

min-width:100%;

}


.table-header{

display:block;

}


}


</style><script>


// ================================
// DATA SYSTEM
// ================================


var ALL_DATA=[];

var currentRangeHours=0;


var charts={};



// ================================
// CHART CONFIG
// ================================


var chartColors={


cv:{
line:'#4de1ff',
fill:'rgba(77,225,255,.12)'
},


ca:{
line:'#ffd166',
fill:'rgba(255,209,102,.12)'
},


cst:{
line:'#ff8fab',
fill:'rgba(255,143,171,.12)'
},


csh:{
line:'#56d9e8',
fill:'rgba(86,217,232,.12)'
},


ctt:{
line:'#ffc266',
fill:'rgba(255,194,102,.12)'
},


cth:{
line:'#c4b5fd',
fill:'rgba(196,181,253,.12)'
},


cs:{
line:'#ffe699',
fill:'rgba(255,230,153,.12)'
},


cws:{
line:'#7dffb8',
fill:'rgba(125,255,184,.12)'
}


};





function createChart(id,label,color){


var ctx=document
.getElementById(id)
.getContext('2d');


charts[id]=new Chart(ctx,{


type:'line',


data:{


labels:[],


datasets:[{

label:label,

data:[],

borderColor:
chartColors[color].line,


backgroundColor:
chartColors[color].fill,


fill:true,


tension:.45,


pointRadius:0,


borderWidth:2.5

}]

},



options:{


responsive:true,


maintainAspectRatio:false,


plugins:{


legend:{
display:false
},


tooltip:{


backgroundColor:
'rgba(0,15,30,.9)',


borderColor:
'rgba(77,225,255,.3)',


borderWidth:1

}

},



scales:{


x:{


ticks:{


color:
'rgba(200,230,255,.5)',


maxTicksLimit:8


},


grid:{


color:
'rgba(255,255,255,.04)'


}

},



y:{


ticks:{


color:
'rgba(200,230,255,.5)'


},


grid:{


color:
'rgba(255,255,255,.04)'


}


}


}


}


});


}







createChart(
"cv",
"Battery Voltage",
"cv"
);


createChart(
"ca",
"Current",
"ca"
);


createChart(
"cst",
"SHT Temperature",
"cst"
);


createChart(
"csh",
"SHT Humidity",
"csh"
);


createChart(
"ctt",
"RS485 Temperature",
"ctt"
);


createChart(
"cth",
"RS485 Humidity",
"cth"
);


createChart(
"cs",
"Solar",
"cs"
);


createChart(
"cws",
"Wind",
"cws"
);







// ================================
// LOAD DATA
// ================================



async function load(){


try{


let res=
await fetch(
"data.json?v="+Date.now()
);


let data=
await res.json();



ALL_DATA=data;


render();


}

catch(e){


console.log(e);


}


}









// ================================
// RANGE FILTER
// ================================



function setRange(hours){


currentRangeHours=hours;


document
.querySelectorAll(".slider-box button")
.forEach(
b=>b.classList.remove("active")
);



let id="btnAll";


if(hours==24)
id="btn24h";

if(hours==6)
id="btn6h";

if(hours==2)
id="btn2h";


let btn=
document.getElementById(id);


if(btn)
btn.classList.add("active");



render();


}









// ================================
// RENDER
// ================================



function render(){


let data=[...ALL_DATA];



if(currentRangeHours>0){


let last=
new Date(
data[data.length-1].time
);


data=data.filter(d=>{


let t=
new Date(d.time);


return

(last-t)/3600000
<=currentRangeHours;


});


}




if(!data.length)
return;



let last=
data[data.length-1];




// STATUS


document
.getElementById("mode")
.innerHTML=
last.mode||"--";


document
.getElementById("voltage")
.innerHTML=
(last.v||0).toFixed(2)
+" V";


document
.getElementById("current")
.innerHTML=
(last.a||0)
+" mA";


document
.getElementById("error")
.innerHTML=
last.e||0;



document
.getElementById("lat")
.innerHTML=
last.x||"--";


document
.getElementById("lng")
.innerHTML=
last.y||"--";


document
.getElementById("sat")
.innerHTML=
last.n||"--";


document
.getElementById("fix")
.innerHTML=
last.g||"--";


document
.getElementById("gpstime")
.innerHTML=
last.time||"--";






updateChart(
"cv",
data.map(d=>d.time),
data.map(d=>d.v)
);



updateChart(
"ca",
data.map(d=>d.time),
data.map(d=>d.a)
);



updateChart(
"cst",
data.map(d=>d.time),
data.map(d=>d.j)
);



updateChart(
"csh",
data.map(d=>d.time),
data.map(d=>d.k)
);



updateChart(
"ctt",
data.map(d=>d.time),
data.map(d=>d.t)
);



updateChart(
"cth",
data.map(d=>d.time),
data.map(d=>d.h)
);



updateChart(
"cs",
data.map(d=>d.time),
data.map(d=>d.s)
);



updateChart(
"cws",
data.map(d=>d.time),
data.map(d=>d.w)
);




renderTable(data);



document
.getElementById("update")
.innerHTML=
"LAST UPDATE : "
+
last.time
+
" · "
+
data.length
+
" RECORDS";



}









function updateChart(id,label,data){


charts[id].data.labels=
label;


charts[id].data.datasets[0].data=
data;


charts[id].update();


}








// ================================
// TABLE
// ================================


function renderTable(data){


let tbody=
document.getElementById("tbody");


tbody.innerHTML="";



data
.slice(-20)
.reverse()
.forEach(d=>{


let tr=
document.createElement("tr");



tr.innerHTML=`

<td>${d.time||""}</td>

<td>${d.mode||""}</td>

<td>${d.v||""}</td>

<td>${d.a||""}</td>

<td>${d.s||""}</td>

<td>${d.j||""}</td>

<td>${d.k||""}</td>

<td>${d.t||""}</td>

<td>${d.h||""}</td>

<td>${d.x||""}</td>

<td>${d.y||""}</td>

<td>${d.n||""}</td>

<td>${d.g||""}</td>

<td>${d.e||""}</td>

`;


tbody.appendChild(tr);


});


}







load();



// 5分钟刷新


setInterval(
load,
300000
);



</script>


</body>

</html>

name: Deploy static content to Pages

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**'
      - 'data.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 构建/部署；
# 新推送到达后自动取消旧的排队任务，只部署最新提交。
# 重要：仓库 Settings → Pages → Source 必须选择 “GitHub Actions”，
# 否则内置 pages build and deployment 会同时运行，与本工作流争抢部署锁。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

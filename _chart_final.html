<!doctype html>
<html><head><meta charset="utf-8">
<style>body{margin:0;background:#111;color:#eee;font:12px monospace}iframe{display:block;border:1px solid #333;margin:4px 0;width:100%;height:900px}pre{white-space:pre-wrap;padding:8px}</style>
</head><body><pre id="out">RUNNING...</pre>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w')||'390',10), h = parseInt(q.get('h')||'844',10);
  fetch('./sensors.html').then(function(r){ return r.text(); }).then(function(src){
    var hook = '<script>window.__ci={};var __oc=window.Chart;window.Chart=function(ctx,cfg){var it=__oc(ctx,cfg);try{window.__ci[ctx.id]=it;}catch(e){}return it;};window.Chart.register=__oc.register;window.Chart.unregister=__oc.unregister;<\/script>';
    src = src.replace('<head>', '<head><base href="http://127.0.0.1:8765/">');
    src = src.replace('<script src="./js/main.js">', hook + '\n<script src="./js/main.js">');
    var f = document.createElement('iframe');
    f.width = w; f.height = h; f.style.width = w+'px'; f.style.height = h+'px';
    f.srcdoc = src;
    f.onload = function(){
      setTimeout(function(){
        try {
          var win = f.contentWindow, d = f.contentDocument;
          var out = {vw:d.documentElement.clientWidth, scrollW:d.documentElement.scrollWidth};
          var inst = win.__ci || {};
          var ids = ['chartInTemp','chartInHum','chartOutTemp','chartOutHum','chartSolar','chartCurrent','chartVoltage','chartWind'];
          var rows = [];
          ids.forEach(function(id){
            var c = inst[id];
            if(!c) return;
            var ds = c.data.datasets[0];
            var x = c.scales.x.options.ticks, y = c.scales.y.options;
            rows.push(id+' c:'+ds.borderColor+' w:'+ds.borderWidth+' t:'+ds.tension+' pr:'+ds.pointRadius+' phr:'+ds.pointHoverRadius+
              ' hov:'+(ds.hoverBorderColor||'')+' rot:'+x.maxRotation+' fs:'+(x.font&&x.font.size)+' xtc:'+x.color+
              ' ytitle:'+((y.title&&y.title.text)||'-'));
          });
          out.charts = rows.join('\n');
          var c = inst.chartVoltage || inst[ids[0]];
          if(c){
            var ticks = (c.scales.x.ticks||[]).map(function(t){return String(t.label);});
            out.ticks = ticks.slice(0,12).join(' | ');
          }
          var pt = d.querySelector('.sensor-grid .panel-title');
          out.badge = pt ? getComputedStyle(pt,'::after').content : 'MISSING';
          out.errors = (win.__errs||[]).join(';') || 'none';
          document.getElementById('out').textContent = 'W='+w+' H='+h+'\n\n'+JSON.stringify(out,null,1);
        } catch(e){ document.getElementById('out').textContent = 'ERR '+e; }
      }, 4000);
    };
    document.body.appendChild(f);
  });
})();
</script></body></html>

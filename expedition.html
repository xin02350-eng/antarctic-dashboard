<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1118"><title>DMS / 极地任务系统</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script defer src="./js/expedition-client.js?v=20261004m"></script>
  <script id="scenePreload">
  /* Inline so selecting the critical lane never adds a blocking script request. */
  (function(){
    const requested=new Set();
    function preload(href,as,priority='high'){
      if(requested.has(href))return;
      requested.add(href);
      const link=document.createElement('link');link.rel='preload';link.as=as;link.href=href;link.fetchPriority=priority;
      if(as==='image')link.type='image/webp';document.head.appendChild(link);
    }
    // Reuse this same lane for the first in-site scene switch. Only requested
    // routes warm their assets; refresh/language changes never add duplicate links.
    window.ExpeditionPreload=function(view){
      if(!window.matchMedia('(min-width:769px)').matches&&new URLSearchParams(location.search).get('client')!=='mobile'&&!window.ExpeditionClient?.mobile)return;
      const device=view==='dashboard',earth=['network','globe'].includes(view);
      if(!device&&!earth)return;
      preload('./assets/three.min.js','script');
      if(device)preload('./assets/runtime/field.45d9b8f65356.js','script'); // runtime-preload:field
      if(earth)preload('./assets/runtime/earth.a1b256850bcf.js','script'); // runtime-preload:earth
      // The frame's deferred scripts wait for its stylesheet. Start that small
      // request alongside its runtime, not one iframe navigation later.
      preload(device?'./css/field-finish.css?v=20261008t':'./css/earth-frame.css?v=20261008t','style');
      preload(device?'./assets/polar/antarctic-glacier-storm-v4.webp':'./assets/geo/earth-surface-v1.webp','image');
      // A complete field reveal needs both original snow materials. Discover them
      // before iframe construction, below the priority of the UI and scene scripts.
      if(device){
        preload('./assets/polar/compacted-snow-crust-v2.webp','image','low');
        preload('./assets/polar/wind-carved-snow-v1.webp','image','low');
      }
    };
    window.ExpeditionPreload(new URLSearchParams(location.search).get('view')||'dashboard');
  })();
  </script>
  <link rel="stylesheet" href="./css/expedition-studio.css?v=20261008r">
  <link rel="stylesheet" href="./css/expedition-actions.css?v=20261004g">
  <link rel="stylesheet" href="./css/expedition-mobile.css?v=20261008t">
  <!-- runtime:app -->
  <script defer fetchpriority="high" src="./assets/runtime/app.f79405cdad67.js"></script>
  <!-- /runtime:app -->
</head>
<body>
  <section id="compatibilityNotice" class="orientation-gate" role="alert" hidden>
    <small>DMS / POLAR SYSTEMS</small><h1>请更新浏览内核</h1>
    <p>请更新 Android System WebView / Chrome，或使用新版浏览器打开。</p>
    <p lang="en">Update your system WebView or browser to open the field view.</p>
    <button id="compatibilityReload" type="button">更新后重新打开 / Retry</button>
  </section>
  <section id="orientationGate" class="orientation-gate" role="dialog" aria-modal="true" aria-labelledby="orientationTitle" hidden>
    <span class="orientation-device" aria-hidden="true"></span><small>DMS / POLAR SYSTEMS</small>
    <h1 id="orientationTitle">横屏，进入极境</h1><p id="orientationMessage" role="status">请将手机横放，展开完整任务现场。</p>
    <button id="enterLandscape" type="button">进入横屏</button>
  </section>
  <div id="polarAtmosphere" aria-hidden="true"></div>
  <a class="skip" href="#content">跳至主要内容 / Skip to content</a>
  <header id="appHeader" class="site-header"></header>
  <main id="content" tabindex="-1"><div id="view"></div><section id="recordWorkspace" class="record-workspace" hidden><div id="telemetryData"></div></section></main>
  <footer id="appFooter" class="site-footer"></footer>
  <noscript>请启用 JavaScript 使用观测系统。原始数据不会因关闭脚本而修改。</noscript>
</body>
</html>
